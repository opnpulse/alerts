# templates/configmap.yaml
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neo4j-alerts.fullname" . }}-configmap
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neo4j-alerts.labels" . | nindent 4 }}
data:
  grafana-json.json: |-
    {
      "dashboard": {
        "__inputs": [],
        "__requires": [
          {
            "type": "grafana",
            "id": "grafana",
            "name": "Grafana",
            "version": "{{ .Values.grafana.version }}"
          },
          {
            "type": "panel",
            "id": "stat",
            "name": "Stat",
            "version": ""
          },
          {
            "type": "panel",
            "id": "gauge",
            "name": "Gauge",
            "version": ""
          },
          {
            "type": "panel",
            "id": "timeseries",
            "name": "Time series",
            "version": ""
          }
        ],
        "annotations": {
          "list": [
            {
              "builtIn": 1,
              "datasource": "-- Grafana --",
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "type": "dashboard"
            }
          ]
        },
        "editable": true,
        "gnetId": null,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "panels": [
          {
            "collapsed": false,
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
            "id": 28,
            "panels": [],
            "title": "Neo4j Phase & Availability",
            "type": "row"
          },
          {
            "datasource": null,
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "mappings": [
                  {
                    "options": {
                      "0": {"color": "green", "index": 0, "text": "OK"},
                      "1": {"color": "red", "index": 1, "text": "DOWN"}
                    },
                    "type": "value"
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 1}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 4, "w": 12, "x": 0, "y": 1},
            "id": 14,
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "textMode": "auto"
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "kubedb_com_neo4j_status_phase{app=\"{{ .Release.Name }}\", namespace=\"{{ $.Release.Namespace }}\", phase=\"NotReady\"}",
                "legendFormat": "",
                "refId": "A"
              }
            ],
            "title": "Neo4j Down",
            "type": "stat"
          },
          {
            "datasource": null,
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "mappings": [
                  {
                    "options": {
                      "0": {"color": "green", "index": 0, "text": "OK"},
                      "1": {"color": "red", "index": 1, "text": "CRITICAL"}
                    },
                    "type": "value"
                  }
                ],
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 1}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 4, "w": 12, "x": 12, "y": 1},
            "id": 2,
            "options": {
              "colorMode": "background",
              "graphMode": "none",
              "justifyMode": "center",
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "textMode": "auto"
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "kubedb_com_neo4j_status_phase{app=\"{{ .Release.Name }}\", namespace=\"{{ $.Release.Namespace }}\", phase=\"Critical\"}",
                "legendFormat": "",
                "refId": "A"
              }
            ],
            "title": "Neo4j Critical Phase",
            "type": "stat"
          },
          {
            "collapsed": false,
            "datasource": null,
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5},
            "id": 48,
            "panels": [],
            "title": "Neo4j Resource Usage",
            "type": "row"
          },
          {
            "datasource": null,
            "description": "Current CPU usage per pod. Alert threshold at 80%.",
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "orange", "value": 70},
                    {"color": "red", "value": 80}
                  ]
                },
                "unit": "percent"
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 6},
            "id": 34,
            "options": {
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "sum by (pod) (irate(container_cpu_usage_seconds_total{namespace=\"{{ $.Release.Namespace }}\", pod=~\"{{ $.Release.Name }}-.*\", container!=\"\", container!=\"POD\"}[5m])) * 100",
                "legendFormat": {{ `"{{pod}}"` }},
                "refId": "A"
              }
            ],
            "title": "Neo4j CPU Usage",
            "type": "gauge"
          },
          {
            "datasource": null,
            "description": "Current memory usage as % of limit per pod. Alert threshold at 80%.",
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "max": 100,
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "orange", "value": 70},
                    {"color": "red", "value": 80}
                  ]
                },
                "unit": "percent"
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 6},
            "id": 36,
            "options": {
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"{{ $.Release.Namespace }}\", pod=~\"{{ $.Release.Name }}-.*\", container!=\"\", container!=\"POD\"}) / sum by (pod) (kube_pod_container_resource_limits{namespace=\"{{ $.Release.Namespace }}\", pod=~\"{{ $.Release.Name }}-.*\", resource=\"memory\"})",
                "legendFormat": {{ `"{{pod}}"` }},
                "refId": "A"
              }
            ],
            "title": "Neo4j Memory Usage",
            "type": "gauge"
          },
          {
            "datasource": null,
            "description": "Current PVC disk usage. Warning at 80%, critical at 95%.",
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "max": 100,
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "orange", "value": 80},
                    {"color": "red", "value": 95}
                  ]
                },
                "unit": "percent"
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 6},
            "id": 40,
            "options": {
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "(kubelet_volume_stats_used_bytes{namespace=\"{{ $.Release.Namespace }}\"} / on(persistentvolumeclaim) group_left(pod) (kubelet_volume_stats_capacity_bytes{namespace=\"{{ $.Release.Namespace }}\"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{namespace=\"{{ $.Release.Namespace }}\", pod=~\"{{ $.Release.Name }}-.*\"})) * 100",
                "legendFormat": {{ `"{{persistentvolumeclaim}}"` }},
                "refId": "A"
              }
            ],
            "title": "Neo4j Disk Usage",
            "type": "gauge"
          },
          {
            "collapsed": false,
            "datasource": null,
            "gridPos": {"h": 1, "w": 24, "x": 0, "y": 14},
            "id": 50,
            "panels": [],
            "title": "Neo4j Page Cache Metrics",
            "type": "row"
          },
          {
            "datasource": null,
            "description": "Page cache fill level. Alert threshold at 85% — consider increasing page cache memory.",
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "max": 100,
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "orange", "value": 80},
                    {"color": "red", "value": 85}
                  ]
                },
                "unit": "percent"
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 15},
            "id": 52,
            "options": {
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "100 * neo4j_dbms_page_cache_usage_ratio{namespace=\"{{ $.Release.Namespace }}\", job=~\"{{ .Release.Name }}.*\"}",
                "legendFormat": {{ `"{{job}}"` }},
                "refId": "A"
              }
            ],
            "title": "Neo4j Page Cache Usage",
            "type": "gauge"
          },
          {
            "datasource": null,
            "description": "Page cache hit ratio — should stay above 98%. Lower means the DB is reading from disk too often.",
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "max": 100,
                "min": 0,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "orange", "value": 95},
                    {"color": "green", "value": 98}
                  ]
                },
                "unit": "percent"
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 15},
            "id": 54,
            "options": {
              "orientation": "auto",
              "reduceOptions": {
                "calcs": ["lastNotNull"],
                "fields": "",
                "values": false
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "100 * neo4j_dbms_page_cache_hit_ratio{namespace=\"{{ $.Release.Namespace }}\", job=~\"{{ .Release.Name }}.*\"}",
                "legendFormat": {{ `"{{job}}"` }},
                "refId": "A"
              }
            ],
            "title": "Neo4j Page Cache Hit Ratio",
            "type": "gauge"
          },
          {
            "datasource": null,
            "description": "Page fault failures over 5m intervals. Any spike above 0 indicates disk I/O issues or corruption.",
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "custom": {
                  "axisCenteredZero": false,
                  "axisColorMode": "text",
                  "axisLabel": "",
                  "axisPlacement": "auto",
                  "barAlignment": 0,
                  "drawStyle": "line",
                  "fillOpacity": 10,
                  "gradientMode": "none",
                  "hideFrom": {"legend": false, "tooltip": false, "viz": false},
                  "lineInterpolation": "linear",
                  "lineWidth": 1,
                  "pointSize": 5,
                  "scaleDistribution": {"type": "linear"},
                  "showPoints": "never",
                  "spanNulls": false,
                  "stacking": {"group": "A", "mode": "none"},
                  "thresholdsStyle": {"mode": "line"}
                },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "red", "value": 1}
                  ]
                }
              },
              "overrides": []
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 15},
            "id": 56,
            "options": {
              "legend": {"calcs": [], "displayMode": "list", "placement": "bottom"},
              "tooltip": {"mode": "multi"}
            },
            "pluginVersion": "{{ .Values.grafana.version }}",
            "targets": [
              {
                "datasource": {"type": "prometheus", "uid": "prometheus"},
                "expr": "increase(neo4j_dbms_page_cache_page_faults_total{namespace=\"{{ $.Release.Namespace }}\", job=~\"{{ .Release.Name }}.*\"}[5m])",
                "legendFormat": {{ `"{{job}}"` }},
                "refId": "A"
              }
            ],
            "title": "Neo4j Page Fault Failures",
            "type": "timeseries"
          }
        ],
        "refresh": "30s",
        "schemaVersion": 27,
        "style": "dark",
        "tags": ["neo4j", "kubedb"],
        "templating": {"list": []},
        "time": {"from": "now-30m", "to": "now"},
        "timepicker": {},
        "timezone": "",
        "title": "{{ .Values.metadata.resource.group }} / {{ .Values.metadata.resource.kind }} / {{ $.Release.Namespace }} / {{ .Release.Name }}",
        "uid": null,
        "version": 23
      },
      "folderId": 0,
      "overwrite": true
    }
{{- end }}
