{{ $app := (include "mongodb-alerts.fullname" .) }}

{{ if (include "mongodb-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mongodb-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "mongodb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mongodb.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $mongodbVirtualMemoryUsage := index (default dict .rules) "mongodbVirtualMemoryUsage" }}
    {{ if (and $mongodbVirtualMemoryUsage (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbVirtualMemoryUsage.enabled $mongodbVirtualMemoryUsage.severity))) -}}
    - alert: MongodbVirtualMemoryUsage
      expr: sum(mongodb_ss_mem_virtual{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) BY (job) > {{ $mongodbVirtualMemoryUsage.val }}
      for: {{ $mongodbVirtualMemoryUsage.duration }}
      labels:
        severity: {{ $mongodbVirtualMemoryUsage.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB virtual memory usage (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "High memory usage\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbReplicationLag := index (default dict .rules) "mongodbReplicationLag" }}
    {{ if (and $mongodbReplicationLag (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbReplicationLag.enabled $mongodbReplicationLag.severity))) -}}
    - alert: MongodbReplicationLag
      expr: mongodb_mongod_replset_member_replication_lag{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > {{ $mongodbReplicationLag.val }}
      for: {{ $mongodbReplicationLag.duration }}
      labels:
        severity: {{ $mongodbReplicationLag.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB database has replication lag (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Mongodb replication lag is more than {{ $mongodbReplicationLag.val }}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbNumberCursorsOpen := index (default dict .rules) "mongodbNumberCursorsOpen" }}
    {{ if (and $mongodbNumberCursorsOpen (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbNumberCursorsOpen.enabled $mongodbNumberCursorsOpen.severity))) -}}
    - alert: MongodbNumberCursorsOpen
      expr: mongodb_ss_metrics_cursor_open{csr_type="total",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > {{ $mongodbNumberCursorsOpen.val }}
      for: {{ $mongodbNumberCursorsOpen.duration }}
      labels:
        severity: {{ $mongodbNumberCursorsOpen.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB number cursors open (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Too many cursors opened by MongoDB for clients (> 10k)\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbCursorsTimeouts := index (default dict .rules) "mongodbCursorsTimeouts" }}
    {{ if (and $mongodbCursorsTimeouts (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbCursorsTimeouts.enabled $mongodbCursorsTimeouts.severity))) -}}
    - alert: MongodbCursorsTimeouts
      expr: increase(mongodb_ss_metrics_cursor_timedOut{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{ $mongodbCursorsTimeouts.val }}
      for: {{ $mongodbCursorsTimeouts.duration }}
      labels:
        severity: {{ $mongodbCursorsTimeouts.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB cursors timeouts (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Too many cursors are timing out\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbTooManyConnections := index (default dict .rules) "mongodbTooManyConnections" }}
    {{ if (and $mongodbTooManyConnections (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbTooManyConnections.enabled $mongodbTooManyConnections.severity))) -}}
    - alert: MongodbTooManyConnections
      expr: avg by(instance) (rate(mongodb_ss_connections{conn_type="current",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m])) / avg by(instance) (sum (mongodb_ss_connections) by (instance)) * 100 > {{ $mongodbTooManyConnections.val }}
      for: {{ $mongodbTooManyConnections.duration }}
      labels:
        severity: {{ $mongodbTooManyConnections.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB too many connections (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Too many connections (> 80%)\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongoDBPhaseCritical := index (default dict .rules) "mongoDBPhaseCritical" }}
    {{ if (and $mongoDBPhaseCritical (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongoDBPhaseCritical.enabled $mongoDBPhaseCritical.severity))) -}}
    - alert: MongoDBPhaseCritical
      expr: kubedb_com_mongodb_status_phase{app="{{ $app }}", namespace="{{ $.Release.Namespace }}",phase="Critical"} >= 1
      for: {{ $mongoDBPhaseCritical.duration }}
      labels:
        severity: {{ $mongoDBPhaseCritical.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB database is in Critical state (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Database in Critical state, one or more database nodes are not working properly.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongoDBDown := index (default dict .rules) "mongoDBDown" }}
    {{ if (and $mongoDBDown (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongoDBDown.enabled $mongoDBDown.severity))) -}}
    - alert: MongoDBDown
      expr: kubedb_com_mongodb_status_phase{app="{{ $app }}", namespace="{{ $.Release.Namespace }}",phase="NotReady"} >= 1
      for: {{ $mongoDBDown.duration }}
      labels:
        severity: {{ $mongoDBDown.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB database is in NotReady state (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Database in NotReady state, database read/write is failing.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbHighLatency := index (default dict .rules) "mongodbHighLatency" }}
    {{ if (and $mongodbHighLatency (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbHighLatency.enabled $mongodbHighLatency.severity))) -}}
    - alert: MongoDBHighLatency
      expr: |
        rate(mongodb_ss_opLatencies_latency{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[5m]) /
        rate(mongodb_ss_opLatencies_ops{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[5m]) > {{ $mongodbHighLatency.val }}
      for: {{ $mongodbHighLatency.duration }}
      labels:
        severity: {{ $mongodbHighLatency.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: High latency in mongodb instances {{`{{`}} $labels.instance {{`}}`}}
        description: "High latency in instances\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbHighTicketUtilization := index (default dict .rules) "mongodbHighTicketUtilization" }}
    {{ if (and $mongodbHighTicketUtilization (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbHighTicketUtilization.enabled $mongodbHighTicketUtilization.severity))) -}}
    - alert: MongoDBHighTicketUtilization
      expr: |
        (mongodb_ss_wt_concurrentTransactions_out{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} /
        mongodb_ss_wt_concurrentTransactions_totalTickets{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) * 100
        > {{ $mongodbHighTicketUtilization.val }}
      for: {{ $mongodbHighTicketUtilization.duration }}
      labels:
        severity: {{ $mongodbHighTicketUtilization.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Ticket usage over 75% {{`{{`}} $labels.instance {{`}}`}}
        description: "Ticket usage over 75%\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbRecurrentCursorTimeout := index (default dict .rules) "mongodbRecurrentCursorTimeout" }}
    {{ if (and $mongodbRecurrentCursorTimeout (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbRecurrentCursorTimeout.enabled $mongodbRecurrentCursorTimeout.severity))) -}}
    - alert: MongoDBRecurrentCursorTimeout
      expr: rate(mongodb_ss_metrics_cursor_timedOut{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[5m]) > {{ $mongodbRecurrentCursorTimeout.val }}
      for: {{ $mongodbRecurrentCursorTimeout.duration }}
      labels:
        severity: {{ $mongodbRecurrentCursorTimeout.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Recurrent cursors timeout in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Recurrent cursors timeout\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $mongodbRecurrentMemoryPageFaults := index (default dict .rules) "mongodbRecurrentMemoryPageFaults" }}
    {{ if (and $mongodbRecurrentMemoryPageFaults (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mongodbRecurrentMemoryPageFaults.enabled $mongodbRecurrentMemoryPageFaults.severity))) -}}
    - alert: MongoDBRecurrentMemoryPageFaults
      expr: rate(mongodb_ss_extra_info_page_faults{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[5m]) > {{ $mongodbRecurrentMemoryPageFaults.val }}
      for: {{ $mongodbRecurrentMemoryPageFaults.duration }}
      labels:
        severity: {{ $mongodbRecurrentMemoryPageFaults.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Recurrent memory page faults in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Recurrent memory page faults\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}

    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{end -}}
  {{end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "mongodb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mongodb.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBMongoDBPhaseNotReady
      expr: kubedb_com_mongodb_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB MongoDB Phase NotReady (mongodb {{`{{`}} $labels.mongodb {{`}}`}})
        description: "KubeDB MongoDB Phase not ready on {{`{{`}} $labels.mongodb {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBMongoDBPhaseCritical
      expr: kubedb_com_mongodb_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB MongoDB Phase Critical (mongodb {{`{{`}} $labels.mongodb {{`}}`}})
        description: "KubeDB MongoDB Phase Critical {{`{{`}} $labels.mongodb {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "mongodb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mongodb.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeDBMongoDBOpsRequestOnProgress
      expr: ops_kubedb_com_mongodbopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDBOpsRequest on progress (mongodbopsrequest {{`{{`}} $labels.mongodbopsrequest {{`}}`}})
        description: "MongoDBOpsRequest {{`{{`}} $labels.mongodbopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeDBMongoDBOpsRequestStatusProgressingToLong
      expr: ops_kubedb_com_mongodbopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDBOpsRequest is in progressing status for too long (mongodbopsrequest {{`{{`}} $labels.mongodbopsrequest {{`}}`}})
        description: "MongoDBOpsRequest {{`{{`}} $labels.mongodbopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeDBMongoDBOpsRequestFailed
      expr: ops_kubedb_com_mongodbopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDBOpsRequest failed (mongodbopsrequest {{`{{`}} $labels.mongodbopsrequest {{`}}`}})
        description: "MongoDBOpsRequest {{`{{`}} $labels.mongodbopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "mongodb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mongodb.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: MongoDBStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MongoDB Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: MongoDBStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MongoDB Stash restore session failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $noBackupSessionForTooLong := index (default dict .rules) "noBackupSessionForTooLong" }}
    {{ if (and $noBackupSessionForTooLong (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $noBackupSessionForTooLong.enabled $noBackupSessionForTooLong.severity))) -}}
    - alert: MongoDBStashNoBackupSessionForTooLong
      expr: time() - stash_backup_last_success_time_seconds + on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} - 1 > {{ $noBackupSessionForTooLong.val }}
      for: {{ $noBackupSessionForTooLong.duration }}
      labels:
        severity: {{ $noBackupSessionForTooLong.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB Stash no backup for last {{ $noBackupSessionForTooLong.val }} second (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MongoDB Stash no backup for too long {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryCorrupted := index (default dict .rules) "repositoryCorrupted" }}
    {{ if (and $repositoryCorrupted (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryCorrupted.enabled $repositoryCorrupted.severity))) -}}
    - alert: MongoDBStashRepositoryCorrupted
      expr: stash_repository_integrity * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $repositoryCorrupted.duration }}
      labels:
        severity: {{ $repositoryCorrupted.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB Stash repository corrupted (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MongoDB Stash repository corrupted {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryStorageRunningLow := index (default dict .rules) "repositoryStorageRunningLow" }}
    {{ if (and $repositoryStorageRunningLow (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryStorageRunningLow.enabled $repositoryStorageRunningLow.severity))) -}}
    - alert: MongoDBStashRepositoryStorageRunningLow
      expr: stash_repository_size_bytes * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} > {{ $repositoryStorageRunningLow.val }}
      for: {{ $repositoryStorageRunningLow.duration }}
      labels:
        severity: {{ $repositoryStorageRunningLow.severity }}
        {{- include "mongodb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MongoDB Stash Repository storage more than {{ $repositoryStorageRunningLow.val }} byte. (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MongoDB Stash Repository storage running low {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $backupSessionPeriodTooLong := index (default dict .rules) "backupSessionPeriodTooLong" }}
    {{ if (and $backupSessionPeriodTooLong (include "mongodb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionPeriodTooLong.enabled $backupSessionPeriodTooLong.severity))) -}}
    - alert: MongoDBStashBackupSessionPeriodTooLong
      expr: stash_backup_session_duration_seconds * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} > {{ $backupSessionPeriodTooLong.val }}
      for: {{ $backupSessionPeriodTooLong.duration }}
      labels:
