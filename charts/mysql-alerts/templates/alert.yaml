{{ $app := (include "mysql-alerts.fullname" .) }}

{{ if (include "mysql-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mysql-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "mysql-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mysql.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $mysqlInstanceDown := index (default dict .rules) "mysqlInstanceDown" }}
    {{ if (and $mysqlInstanceDown (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlInstanceDown.enabled $mysqlInstanceDown.severity))) -}}
    - alert: MySQLInstanceDown
      expr: mysql_up{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $mysqlInstanceDown.duration }}
      labels:
        severity: {{ $mysqlInstanceDown.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL instance down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL instance is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlServiceDown := index (default dict .rules) "mysqlServiceDown" }}
    {{ if (and $mysqlServiceDown (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlServiceDown.enabled $mysqlServiceDown.severity))) -}}
    - alert: MySQLServiceDown
      expr: sum by (service) (mysql_up{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) == 0
      for: {{ $mysqlServiceDown.duration }}
      labels:
        severity: {{ $mysqlServiceDown.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL service down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL service is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlTooManyConnections := index (default dict .rules) "mysqlTooManyConnections" }}
    {{ if (and $mysqlTooManyConnections (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlTooManyConnections.enabled $mysqlTooManyConnections.severity))) -}}
    - alert: MySQLTooManyConnections
      expr: max_over_time(mysql_global_status_threads_connected{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_max_connections{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlTooManyConnections.val}}
      for: {{ $mysqlTooManyConnections.duration }}
      labels:
        severity: {{ $mysqlTooManyConnections.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL too many connections (> {{$mysqlTooManyConnections.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "More than {{$mysqlTooManyConnections.val}}% of MySQL connections are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighThreadsRunning := index (default dict .rules) "mysqlHighThreadsRunning" }}
    {{ if (and $mysqlHighThreadsRunning (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighThreadsRunning.enabled $mysqlHighThreadsRunning.severity))) -}}
    - alert: MySQLHighThreadsRunning
      expr: max_over_time(mysql_global_status_threads_running{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_max_connections{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlHighThreadsRunning.val}}
      for: {{ $mysqlHighThreadsRunning.duration }}
      labels:
        severity: {{ $mysqlHighThreadsRunning.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL high threads running (> {{$mysqlHighThreadsRunning.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "More than {{$mysqlHighThreadsRunning.val}}% of MySQL threads are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlSlowQueries := index (default dict .rules) "mysqlSlowQueries" }}
    {{ if (and $mysqlSlowQueries (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlSlowQueries.enabled $mysqlSlowQueries.severity))) -}}
    - alert: MySQLSlowQueries
      expr: increase(mysql_global_status_slow_queries{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > 0
      for: {{ $mysqlSlowQueries.duration }}
      labels:
        severity: {{ $mysqlSlowQueries.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL slow queries on (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL server mysql has some new slow query.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlInnoDBLogWaits := index (default dict .rules) "mysqlInnoDBLogWaits" }}
    {{ if (and $mysqlInnoDBLogWaits (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlInnoDBLogWaits.enabled $mysqlInnoDBLogWaits.severity))) -}}
    - alert: MySQLInnoDBLogWaits
      expr: rate(mysql_global_status_innodb_log_waits{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[15m]) > {{$mysqlInnoDBLogWaits.val}}
      for: {{ $mysqlInnoDBLogWaits.duration }}
      labels:
        severity: {{ $mysqlInnoDBLogWaits.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL InnoDB log waits (> {{$mysqlInnoDBLogWaits.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL innodb log writes stalling\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlRestarted := index (default dict .rules) "mysqlRestarted" }}
    {{ if (and $mysqlRestarted (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlRestarted.enabled $mysqlRestarted.severity))) -}}
    - alert: MySQLRestarted
      expr: mysql_global_status_uptime{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} < {{$mysqlRestarted.val}}
      for: {{ $mysqlRestarted.duration }}
      labels:
        severity: {{ $mysqlRestarted.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL restarted ({{$mysqlRestarted.val}} second ago) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL restarted\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighQPS := index (default dict .rules) "mysqlHighQPS" }}
    {{ if (and $mysqlHighQPS (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighQPS.enabled $mysqlHighQPS.severity))) -}}
    - alert: MySQLHighQPS
      expr: rate(mysql_global_status_queries{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighQPS.val}}
      for: {{ $mysqlHighQPS.duration }}
      labels:
        severity: {{ $mysqlHighQPS.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL has high queries per second (> {{$mysqlHighQPS.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL has high QPS on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighIncomingBytes := index (default dict .rules) "mysqlHighIncomingBytes" }}
    {{ if (and $mysqlHighIncomingBytes (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighIncomingBytes.enabled $mysqlHighIncomingBytes.severity))) -}}
    - alert: MySQLHighIncomingBytes
      expr: rate(mysql_global_status_bytes_received{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighIncomingBytes.val}}
      for: {{ $mysqlHighIncomingBytes.duration }}
      labels:
        severity: {{ $mysqlHighIncomingBytes.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL has high incoming bytes second (> {{$mysqlHighIncomingBytes.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL has high incoming bytes per second on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighOutgoingBytes := index (default dict .rules) "mysqlHighOutgoingBytes" }}
    {{ if (and $mysqlHighOutgoingBytes (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighOutgoingBytes.enabled $mysqlHighOutgoingBytes.severity))) -}}
    - alert: MySQLHighOutgoingBytes
      expr: rate(mysql_global_status_bytes_sent{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighOutgoingBytes.val}}
      for: {{ $mysqlHighOutgoingBytes.duration }}
      labels:
        severity: {{ $mysqlHighOutgoingBytes.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL has high outgoing bytes second (> {{$mysqlHighOutgoingBytes.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL has high outgoing bytes per second on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlTooManyOpenFiles := index (default dict .rules) "mysqlTooManyOpenFiles" }}
    {{ if (and $mysqlTooManyOpenFiles (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlTooManyOpenFiles.enabled $mysqlTooManyOpenFiles.severity))) -}}
    - alert: MySQLTooManyOpenFiles
      expr: max_over_time(mysql_global_status_open_files{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_open_files_limit{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlTooManyOpenFiles.val}}
      for: {{ $mysqlTooManyOpenFiles.duration }}
      labels:
        severity: {{ $mysqlTooManyOpenFiles.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL too many opened files (> {{$mysqlTooManyOpenFiles.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL too many opened files on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) (kubelet_volume_stats_capacity_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) (kubelet_volume_stats_capacity_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.group -}}
  {{ if (include "mysql-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mysql.group.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $mysqlHighReplicationDelay := index (default dict .rules) "mysqlHighReplicationDelay" }}
    {{ if (and $mysqlHighReplicationDelay (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighReplicationDelay.enabled $mysqlHighReplicationDelay.severity))) -}}
    - alert: MySQLHighReplicationDelay
      expr: max by (pod) (mysql_perf_schema_replication_group_worker_apply_time_seconds{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) > {{$mysqlHighReplicationDelay.val}}
      for: {{ $mysqlHighReplicationDelay.duration }}
      labels:
        severity: {{ $mysqlHighReplicationDelay.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL Group Replication delay too high ( > {{$mysqlHighReplicationDelay.val}} second) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL Group Replication delay too high {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighReplicationTransportTime := index (default dict .rules) "mysqlHighReplicationTransportTime" }}
    {{ if (and $mysqlHighReplicationTransportTime (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighReplicationTransportTime.enabled $mysqlHighReplicationTransportTime.severity))) -}}
    - alert: MySQLHighReplicationTransportTime
      expr: max by (pod) (mysql_perf_schema_replication_group_worker_transport_time_seconds{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) > {{$mysqlHighReplicationTransportTime.val}}
      for: {{ $mysqlHighReplicationTransportTime.duration }}
      labels:
        severity: {{ $mysqlHighReplicationTransportTime.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL Group Replication transport time too high ( > {{$mysqlHighReplicationTransportTime.val}} second) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL Group Replication transport time too high {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighReplicationApplyTime := index (default dict .rules) "mysqlHighReplicationApplyTime" }}
    {{ if (and $mysqlHighReplicationApplyTime (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighReplicationApplyTime.enabled $mysqlHighReplicationApplyTime.severity))) -}}
    - alert: MySQLHighReplicationApplyTime
      expr: max by (pod) (mysql_perf_schema_replication_group_worker_apply_time_seconds{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) > {{$mysqlHighReplicationApplyTime.val}}
      for: {{ $mysqlHighReplicationApplyTime.duration }}
      labels:
        severity: {{ $mysqlHighReplicationApplyTime.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL Group Replication apply time too high ( > {{$mysqlHighReplicationApplyTime.val}} second) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL Group Replication apply time too high {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlReplicationHighTransactionTime := index (default dict .rules) "mysqlReplicationHighTransactionTime" }}
    {{ if (and $mysqlReplicationHighTransactionTime (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlReplicationHighTransactionTime.enabled $mysqlReplicationHighTransactionTime.severity))) -}}
    - alert: MySQLReplicationHighTransactionTime
      expr: max by (pod) (mysql_perf_schema_replication_group_worker_time_RL_seconds{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) > {{$mysqlReplicationHighTransactionTime.val}}
      for: {{ $mysqlReplicationHighTransactionTime.duration }}
      labels:
        severity: {{ $mysqlReplicationHighTransactionTime.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL Group Replication, Transaction time on local queue is too long ( > {{$mysqlReplicationHighTransactionTime.val}} second) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MySQL Group Replication, Transaction time on local queue is too long {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "mysql-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mysql.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBMySQLPhaseNotReady
      expr: kubedb_com_mysql_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB MySQL Phase NotReady (mysql {{`{{`}} $labels.mysql {{`}}`}})
        description: "KubeDB MySQL Phase not ready on {{`{{`}} $labels.mysql {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBMySQLPhaseCritical
      expr: kubedb_com_mysql_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB MySQL Phase Critical (mysql {{`{{`}} $labels.mysql {{`}}`}})
        description: "KubeDB MySQL Phase Critical {{`{{`}} $labels.mysql {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "mysql-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mysql.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeDBMySQLOpsRequestOnProgress
      expr: ops_kubedb_com_mysqlopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQLOpsRequest on progress (mysqlopsrequest {{`{{`}} $labels.mysqlopsrequest {{`}}`}})
        description: "MySQLOpsRequest {{`{{`}} $labels.mysqlopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeDBMySQLOpsRequestStatusProgressingToLong
      expr: ops_kubedb_com_mysqlopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQLOpsRequest is in progressing status for too long (mysqlopsrequest {{`{{`}} $labels.mysqlopsrequest {{`}}`}})
        description: "MySQLOpsRequest {{`{{`}} $labels.mysqlopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeDBMySQLOpsRequestFailed
      expr: ops_kubedb_com_mysqlopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQLOpsRequest failed (mysqlopsrequest {{`{{`}} $labels.mysqlopsrequest {{`}}`}})
        description: "MySQLOpsRequest {{`{{`}} $labels.mysqlopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "mysql-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mysql.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: MySQLStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MySQL Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "mysql-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: MySQLStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "mysql-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MySQL Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
