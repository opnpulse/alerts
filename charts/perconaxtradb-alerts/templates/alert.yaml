{{ $app := (include "perconaxtradb-alerts.fullname" .) }}

{{ if (include "perconaxtradb-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "perconaxtradb-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "perconaxtradb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: perconaxtradb.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $mysqlInstanceDown := index (default dict .rules) "mysqlInstanceDown" }}
    {{ if (and $mysqlInstanceDown (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlInstanceDown.enabled $mysqlInstanceDown.severity))) -}}
    - alert: PerconaXtraDBInstanceDown
      expr: mysql_up{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $mysqlInstanceDown.duration }}
      labels:
        severity: {{ $mysqlInstanceDown.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB instance down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB instance is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlServiceDown := index (default dict .rules) "mysqlServiceDown" }}
    {{ if (and $mysqlServiceDown (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlServiceDown.enabled $mysqlServiceDown.severity))) -}}
    - alert: PerconaXtraDBServiceDown
      expr: sum by (service) (mysql_up{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) == 0
      for: {{ $mysqlServiceDown.duration }}
      labels:
        severity: {{ $mysqlServiceDown.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB service down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB service is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlTooManyConnections := index (default dict .rules) "mysqlTooManyConnections" }}
    {{ if (and $mysqlTooManyConnections (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlTooManyConnections.enabled $mysqlTooManyConnections.severity))) -}}
    - alert: PerconaXtraDBTooManyConnections
      expr: max_over_time(mysql_global_status_threads_connected{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_max_connections{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlTooManyConnections.val}}
      for: {{ $mysqlTooManyConnections.duration }}
      labels:
        severity: {{ $mysqlTooManyConnections.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB too many connections (> {{$mysqlTooManyConnections.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "More than {{$mysqlTooManyConnections.val}}% of PerconaXtraDB connections are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighThreadsRunning := index (default dict .rules) "mysqlHighThreadsRunning" }}
    {{ if (and $mysqlHighThreadsRunning (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighThreadsRunning.enabled $mysqlHighThreadsRunning.severity))) -}}
    - alert: PerconaXtraDBHighThreadsRunning
      expr: max_over_time(mysql_global_status_threads_running{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_max_connections{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlHighThreadsRunning.val}}
      for: {{ $mysqlHighThreadsRunning.duration }}
      labels:
        severity: {{ $mysqlHighThreadsRunning.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB high threads running (> {{$mysqlHighThreadsRunning.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "More than {{$mysqlHighThreadsRunning.val}}% of PerconaXtraDB threads are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlSlowQueries := index (default dict .rules) "mysqlSlowQueries" }}
    {{ if (and $mysqlSlowQueries (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlSlowQueries.enabled $mysqlSlowQueries.severity))) -}}
    - alert: PerconaXtraDBSlowQueries
      expr: increase(mysql_global_status_slow_queries{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > 0
      for: {{ $mysqlSlowQueries.duration }}
      labels:
        severity: {{ $mysqlSlowQueries.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB slow queries on (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB server perconaxtradb has some new slow query.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlInnoDBLogWaits := index (default dict .rules) "mysqlInnoDBLogWaits" }}
    {{ if (and $mysqlInnoDBLogWaits (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlInnoDBLogWaits.enabled $mysqlInnoDBLogWaits.severity))) -}}
    - alert: PerconaXtraDBInnoDBLogWaits
      expr: rate(mysql_global_status_innodb_log_waits{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[15m]) > {{$mysqlInnoDBLogWaits.val}}
      for: {{ $mysqlInnoDBLogWaits.duration }}
      labels:
        severity: {{ $mysqlInnoDBLogWaits.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB InnoDB log waits (> {{$mysqlInnoDBLogWaits.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB innodb log writes stalling\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlRestarted := index (default dict .rules) "mysqlRestarted" }}
    {{ if (and $mysqlRestarted (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlRestarted.enabled $mysqlRestarted.severity))) -}}
    - alert: PerconaXtraDBRestarted
      expr: mysql_global_status_uptime{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} < {{$mysqlRestarted.val}}
      for: {{ $mysqlRestarted.duration }}
      labels:
        severity: {{ $mysqlRestarted.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB restarted ({{$mysqlRestarted.val}} second ago) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB restarted\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighQPS := index (default dict .rules) "mysqlHighQPS" }}
    {{ if (and $mysqlHighQPS (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighQPS.enabled $mysqlHighQPS.severity))) -}}
    - alert: PerconaXtraDBHighQPS
      expr: rate(mysql_global_status_queries{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighQPS.val}}
      for: {{ $mysqlHighQPS.duration }}
      labels:
        severity: {{ $mysqlHighQPS.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB has high queries per second (> {{$mysqlHighQPS.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB has high QPS on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighIncomingBytes := index (default dict .rules) "mysqlHighIncomingBytes" }}
    {{ if (and $mysqlHighIncomingBytes (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighIncomingBytes.enabled $mysqlHighIncomingBytes.severity))) -}}
    - alert: PerconaXtraDBHighIncomingBytes
      expr: rate(mysql_global_status_bytes_received{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighIncomingBytes.val}}
      for: {{ $mysqlHighIncomingBytes.duration }}
      labels:
        severity: {{ $mysqlHighIncomingBytes.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB has high incoming bytes second (> {{$mysqlHighIncomingBytes.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB has high incoming bytes per second on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighOutgoingBytes := index (default dict .rules) "mysqlHighOutgoingBytes" }}
    {{ if (and $mysqlHighOutgoingBytes (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighOutgoingBytes.enabled $mysqlHighOutgoingBytes.severity))) -}}
    - alert: PerconaXtraDBHighOutgoingBytes
      expr: rate(mysql_global_status_bytes_sent{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighOutgoingBytes.val}}
      for: {{ $mysqlHighOutgoingBytes.duration }}
      labels:
        severity: {{ $mysqlHighOutgoingBytes.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB has high outgoing bytes second (> {{$mysqlHighOutgoingBytes.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB has high outgoing bytes per second on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlTooManyOpenFiles := index (default dict .rules) "mysqlTooManyOpenFiles" }}
    {{ if (and $mysqlTooManyOpenFiles (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlTooManyOpenFiles.enabled $mysqlTooManyOpenFiles.severity))) -}}
    - alert: PerconaXtraDBTooManyOpenFiles
      expr: max_over_time(mysql_global_status_open_files{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_open_files_limit{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlTooManyOpenFiles.val}}
      for: {{ $mysqlTooManyOpenFiles.duration }}
      labels:
        severity: {{ $mysqlTooManyOpenFiles.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB too many opened files (> {{$mysqlTooManyOpenFiles.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB too many opened files on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.cluster -}}
  {{ if (include "perconaxtradb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: perconaxtradb.cluster.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $galeraReplicationLatencyTooLong := index (default dict .rules) "galeraReplicationLatencyTooLong" }}
    {{ if (and $galeraReplicationLatencyTooLong (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $galeraReplicationLatencyTooLong.enabled $galeraReplicationLatencyTooLong.severity))) -}}
    - alert: GaleraReplicationLatencyTooLong
      expr: mysql_galera_evs_repl_latency_avg_seconds{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > {{$galeraReplicationLatencyTooLong.val}}
      for: {{ $galeraReplicationLatencyTooLong.duration }}
      labels:
        severity: {{ $galeraReplicationLatencyTooLong.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB Galera Cluster latency too long ( > {{$galeraReplicationLatencyTooLong.val}} second,) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PerconaXtraDB Galera Cluster latency too long on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "perconaxtradb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: perconaxtradb.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBPerconaXtraDBPhaseNotReady
      expr: kubedb_com_perconaxtradb_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB PerconaXtraDB Phase NotReady (perconaxtradb {{`{{`}} $labels.perconaxtradb {{`}}`}})
        description: "KubeDB PerconaXtraDB Phase not ready on {{`{{`}} $labels.perconaxtradb {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBPerconaXtraDBPhaseCritical
      expr: kubedb_com_perconaxtradb_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB PerconaXtraDB Phase Critical (perconaxtradb {{`{{`}} $labels.perconaxtradb {{`}}`}})
        description: "KubeDB PerconaXtraDB Phase Critical {{`{{`}} $labels.perconaxtradb {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "perconaxtradb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: perconaxtradb.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeDBPerconaXtraDBOpsRequestOnProgress
      expr: ops_kubedb_com_perconaxtradbopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDBOpsRequest on progress (perconaxtradbopsrequest {{`{{`}} $labels.perconaxtradbopsrequest {{`}}`}})
        description: "PerconaXtraDBOpsRequest {{`{{`}} $labels.perconaxtradbopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeDBPerconaXtraDBOpsRequestStatusProgressingToLong
      expr: ops_kubedb_com_perconaxtradbopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDBOpsRequest is in progressing status for too long (perconaxtradbopsrequest {{`{{`}} $labels.perconaxtradbopsrequest {{`}}`}})
        description: "PerconaXtraDBOpsRequest {{`{{`}} $labels.perconaxtradbopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeDBPerconaXtraDBOpsRequestFailed
      expr: ops_kubedb_com_perconaxtradbopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDBOpsRequest failed (perconaxtradbopsrequest {{`{{`}} $labels.perconaxtradbopsrequest {{`}}`}})
        description: "PerconaXtraDBOpsRequest {{`{{`}} $labels.perconaxtradbopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "perconaxtradb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: perconaxtradb.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: PerconaXtraDBStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PerconaXtraDB Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: PerconaXtraDBStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PerconaXtraDB Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PerconaXtraDB Stash restore session failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $noBackupSessionForTooLong := index (default dict .rules) "noBackupSessionForTooLong" }}
    {{ if (and $noBackupSessionForTooLong (include "perconaxtradb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $noBackupSessionForTooLong.enabled $noBackupSessionForTooLong.severity))) -}}
    - alert: PerconaXtraDBStashNoBackupSessionForTooLong
      expr: time() - stash_backup_last_success_time_seconds + on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} - 1 > {{ $noBackupSessionForTooLong.val }}
      for: {{ $noBackupSessionForTooLong.duration }}
      labels:
        severity: {{ $noBackupSessionForTooLong.severity }}
        {{- include "perconaxtradb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
