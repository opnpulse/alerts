{{ $app := (include "mariadb-alerts.fullname" .) }}

{{ if (include "mariadb-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mariadb-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "mariadb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mariadb.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $mysqlInstanceDown := index (default dict .rules) "mysqlInstanceDown" }}
    {{ if (and $mysqlInstanceDown (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlInstanceDown.enabled $mysqlInstanceDown.severity))) -}}
    - alert: MariaDBInstanceDown
      expr: mysql_up{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $mysqlInstanceDown.duration }}
      labels:
        severity: {{ $mysqlInstanceDown.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB instance down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB instance is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlServiceDown := index (default dict .rules) "mysqlServiceDown" }}
    {{ if (and $mysqlServiceDown (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlServiceDown.enabled $mysqlServiceDown.severity))) -}}
    - alert: MariaDBServiceDown
      expr: sum by (service) (mysql_up{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) == 0
      for: {{ $mysqlServiceDown.duration }}
      labels:
        severity: {{ $mysqlServiceDown.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB service down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB service is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlTooManyConnections := index (default dict .rules) "mysqlTooManyConnections" }}
    {{ if (and $mysqlTooManyConnections (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlTooManyConnections.enabled $mysqlTooManyConnections.severity))) -}}
    - alert: MariaDBTooManyConnections
      expr: max_over_time(mysql_global_status_threads_connected{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_max_connections{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlTooManyConnections.val}}
      for: {{ $mysqlTooManyConnections.duration }}
      labels:
        severity: {{ $mysqlTooManyConnections.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB too many connections (> {{$mysqlTooManyConnections.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "More than {{$mysqlTooManyConnections.val}}% of MariaDB connections are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighThreadsRunning := index (default dict .rules) "mysqlHighThreadsRunning" }}
    {{ if (and $mysqlHighThreadsRunning (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighThreadsRunning.enabled $mysqlHighThreadsRunning.severity))) -}}
    - alert: MariaDBHighThreadsRunning
      expr: max_over_time(mysql_global_status_threads_running{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_max_connections{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlHighThreadsRunning.val}}
      for: {{ $mysqlHighThreadsRunning.duration }}
      labels:
        severity: {{ $mysqlHighThreadsRunning.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB high threads running (> {{$mysqlHighThreadsRunning.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "More than {{$mysqlHighThreadsRunning.val}}% of MariaDB threads are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlSlowQueries := index (default dict .rules) "mysqlSlowQueries" }}
    {{ if (and $mysqlSlowQueries (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlSlowQueries.enabled $mysqlSlowQueries.severity))) -}}
    - alert: MariaDBSlowQueries
      expr: increase(mysql_global_status_slow_queries{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > 0
      for: {{ $mysqlSlowQueries.duration }}
      labels:
        severity: {{ $mysqlSlowQueries.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB slow queries on (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB server mariadb has some new slow query.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlInnoDBLogWaits := index (default dict .rules) "mysqlInnoDBLogWaits" }}
    {{ if (and $mysqlInnoDBLogWaits (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlInnoDBLogWaits.enabled $mysqlInnoDBLogWaits.severity))) -}}
    - alert: MariaDBInnoDBLogWaits
      expr: rate(mysql_global_status_innodb_log_waits{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[15m]) > {{$mysqlInnoDBLogWaits.val}}
      for: {{ $mysqlInnoDBLogWaits.duration }}
      labels:
        severity: {{ $mysqlInnoDBLogWaits.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB InnoDB log waits (> {{$mysqlInnoDBLogWaits.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB innodb log writes stalling\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlRestarted := index (default dict .rules) "mysqlRestarted" }}
    {{ if (and $mysqlRestarted (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlRestarted.enabled $mysqlRestarted.severity))) -}}
    - alert: MariaDBRestarted
      expr: mysql_global_status_uptime{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} < {{$mysqlRestarted.val}}
      for: {{ $mysqlRestarted.duration }}
      labels:
        severity: {{ $mysqlRestarted.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB restarted ({{$mysqlRestarted.val}} second ago) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB restarted\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighQPS := index (default dict .rules) "mysqlHighQPS" }}
    {{ if (and $mysqlHighQPS (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighQPS.enabled $mysqlHighQPS.severity))) -}}
    - alert: MariaDBHighQPS
      expr: rate(mysql_global_status_queries{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighQPS.val}}
      for: {{ $mysqlHighQPS.duration }}
      labels:
        severity: {{ $mysqlHighQPS.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB has high queries per second (> {{$mysqlHighQPS.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB has high QPS on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighIncomingBytes := index (default dict .rules) "mysqlHighIncomingBytes" }}
    {{ if (and $mysqlHighIncomingBytes (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighIncomingBytes.enabled $mysqlHighIncomingBytes.severity))) -}}
    - alert: MariaDBHighIncomingBytes
      expr: rate(mysql_global_status_bytes_received{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighIncomingBytes.val}}
      for: {{ $mysqlHighIncomingBytes.duration }}
      labels:
        severity: {{ $mysqlHighIncomingBytes.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB has high incoming bytes second (> {{$mysqlHighIncomingBytes.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB has high incoming bytes per second on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlHighOutgoingBytes := index (default dict .rules) "mysqlHighOutgoingBytes" }}
    {{ if (and $mysqlHighOutgoingBytes (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlHighOutgoingBytes.enabled $mysqlHighOutgoingBytes.severity))) -}}
    - alert: MariaDBHighOutgoingBytes
      expr: rate(mysql_global_status_bytes_sent{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) > {{$mysqlHighOutgoingBytes.val}}
      for: {{ $mysqlHighOutgoingBytes.duration }}
      labels:
        severity: {{ $mysqlHighOutgoingBytes.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB has high outgoing bytes second (> {{$mysqlHighOutgoingBytes.val}}) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB has high outgoing bytes per second on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $mysqlTooManyOpenFiles := index (default dict .rules) "mysqlTooManyOpenFiles" }}
    {{ if (and $mysqlTooManyOpenFiles (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $mysqlTooManyOpenFiles.enabled $mysqlTooManyOpenFiles.severity))) -}}
    - alert: MariaDBTooManyOpenFiles
      expr: max_over_time(mysql_global_status_open_files{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[1m]) / mysql_global_variables_open_files_limit{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 > {{$mysqlTooManyOpenFiles.val}}
      for: {{ $mysqlTooManyOpenFiles.duration }}
      labels:
        severity: {{ $mysqlTooManyOpenFiles.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB too many opened files (> {{$mysqlTooManyOpenFiles.val}}%) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB too many opened files on (instance {{`{{`}} $labels.pod {{`}}`}})\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.cluster -}}
  {{ if (include "mariadb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mariadb.cluster.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $galeraReplicationLatencyTooLong := index (default dict .rules) "galeraReplicationLatencyTooLong" }}
    {{ if (and $galeraReplicationLatencyTooLong (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $galeraReplicationLatencyTooLong.enabled $galeraReplicationLatencyTooLong.severity))) -}}
    - alert: GaleraReplicationLatencyTooLong
      expr: mysql_galera_evs_repl_latency_avg_seconds{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > {{$galeraReplicationLatencyTooLong.val}}
      for: {{ $galeraReplicationLatencyTooLong.duration }}
      labels:
        severity: {{ $galeraReplicationLatencyTooLong.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB Galera Cluster latency too long ( > {{$galeraReplicationLatencyTooLong.val}} second,) (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "MariaDB Galera Cluster latency too long on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "mariadb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mariadb.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBMariaDBPhaseNotReady
      expr: kubedb_com_mariadb_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB MariaDB Phase NotReady (mariadb {{`{{`}} $labels.mariadb {{`}}`}})
        description: "KubeDB MariaDB Phase not ready on {{`{{`}} $labels.mariadb {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBMariaDBPhaseCritical
      expr: kubedb_com_mariadb_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB MariaDB Phase Critical (mariadb {{`{{`}} $labels.mariadb {{`}}`}})
        description: "KubeDB MariaDB Phase Critical {{`{{`}} $labels.mariadb {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "mariadb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mariadb.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeDBMariaDBOpsRequestOnProgress
      expr: ops_kubedb_com_mariadbopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDBOpsRequest on progress (mariadbopsrequest {{`{{`}} $labels.mariadbopsrequest {{`}}`}})
        description: "MariaDBOpsRequest {{`{{`}} $labels.mariadbopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeDBMariaDBOpsRequestStatusProgressingToLong
      expr: ops_kubedb_com_mariadbopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDBOpsRequest is in progressing status for too long (mariadbopsrequest {{`{{`}} $labels.mariadbopsrequest {{`}}`}})
        description: "MariaDBOpsRequest {{`{{`}} $labels.mariadbopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeDBMariaDBOpsRequestFailed
      expr: ops_kubedb_com_mariadbopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDBOpsRequest failed (mariadbopsrequest {{`{{`}} $labels.mariadbopsrequest {{`}}`}})
        description: "MariaDBOpsRequest {{`{{`}} $labels.mariadbopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "mariadb-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: mariadb.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: MariaDBStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MariaDB Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: MariaDBStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MariaDB Stash restore session failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $noBackupSessionForTooLong := index (default dict .rules) "noBackupSessionForTooLong" }}
    {{ if (and $noBackupSessionForTooLong (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $noBackupSessionForTooLong.enabled $noBackupSessionForTooLong.severity))) -}}
    - alert: MariaDBStashNoBackupSessionForTooLong
      expr: time() - stash_backup_last_success_time_seconds + on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} - 1 > {{ $noBackupSessionForTooLong.val }}
      for: {{ $noBackupSessionForTooLong.duration }}
      labels:
        severity: {{ $noBackupSessionForTooLong.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB Stash no backup for last {{ $noBackupSessionForTooLong.val }} second (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "MariaDB Stash no backup for too long {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryCorrupted := index (default dict .rules) "repositoryCorrupted" }}
    {{ if (and $repositoryCorrupted (include "mariadb-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryCorrupted.enabled $repositoryCorrupted.severity))) -}}
    - alert: MariaDBStashRepositoryCorrupted
      expr: stash_repository_integrity * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $repositoryCorrupted.duration }}
      labels:
        severity: {{ $repositoryCorrupted.severity }}
        {{- include "mariadb-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: MariaDB Stash repository corrupted (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
