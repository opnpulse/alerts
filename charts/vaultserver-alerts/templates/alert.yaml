{{ $app := (include "vaultserver-alerts.fullname" .) }}

{{ if (include "vaultserver-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vaultserver-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.vault -}}
  {{ if (include "vaultserver-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: vaultserver.vault.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $vaultDown := index (default dict .rules) "vaultDown" }}
    {{ if (and $vaultDown (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultDown.enabled $vaultDown.severity))) -}}
    - alert: VaultDown
      expr: up{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $vaultDown.duration }}
      labels:
        severity: {{ $vaultDown.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Vault instance down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Vault instance is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{end -}}
    {{ $vaultSealed := index (default dict .rules) "vaultSealed" }}
    {{ if (and $vaultSealed (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultSealed.enabled $vaultSealed.severity))) -}}
    - alert: VaultSealed
      expr: vault_core_unsealed{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $vaultSealed.duration }}
      labels:
        severity: {{ $vaultSealed.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultServer instance Sealed (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "VaultServer instance is sealed on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultAutoPilotNodeUnhealthy := index (default dict .rules) "vaultAutoPilotNodeUnhealthy" }}
    {{ if (and $vaultAutoPilotNodeUnhealthy (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultAutoPilotNodeUnhealthy.enabled $vaultAutoPilotNodeUnhealthy.severity))) -}}
    - alert: VaultAutopilotNodeUnhealthy
      expr: vault_autopilot_healthy{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} < 1
      for: {{ $vaultAutoPilotNodeUnhealthy.duration }}
      labels:
        severity: {{ $vaultAutoPilotNodeUnhealthy.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Autopilot Vault Raft node unhealthy (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "At least one of the Autopilot Vault Raft nodes is unhealthy on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultLeadershipLoss := index (default dict .rules) "vaultLeadershipLoss" }}
    {{ if (and $vaultLeadershipLoss (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultLeadershipLoss.enabled $vaultLeadershipLoss.severity))) -}}
    - alert: VaultLeadershipLoss
      expr: sum(increase(vault_core_leadership_lost_count{job="{{- $app -}}-stats"}[1h])) > {{$vaultLeadershipLoss.val}}
      for: {{ $vaultLeadershipLoss.duration }}
      labels:
        severity: {{ $vaultLeadershipLoss.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary:  High frequency of Vault leadership losses (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "There have been more than 5 Vault leadership losses in the past 1h on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultLeadershipStepsDowns := index (default dict .rules) "vaultLeadershipStepsDowns" }}
    {{ if (and $vaultLeadershipStepsDowns (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultLeadershipStepsDowns.enabled $vaultLeadershipStepsDowns.severity))) -}}
    - alert: VaultLeadershipStepsDown
      expr: sum(increase(vault_core_step_down_count{job="{{- $app -}}-stats"}[1h])) > {{$vaultLeadershipStepsDowns.val}}
      for: {{ $vaultLeadershipStepsDowns.duration }}
      labels:
        severity: {{ $vaultLeadershipStepsDowns.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: High frequency of Vault leadership steps down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "There have been more than 5 Vault leadership steps down in the past 1h on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultLeadershipSetupFailures := index (default dict .rules) "vaultLeadershipSetupFailures" }}
    {{ if (and $vaultLeadershipSetupFailures (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultLeadershipSetupFailures.enabled $vaultLeadershipSetupFailures.severity))) -}}
    - alert: VaultLeadershipSetupFailures
      expr: sum(increase(vault_core_leadership_setup_failed{job="{{- $app -}}-stats"}[1h])) > {{$vaultLeadershipSetupFailures.val}}
      for: {{ $vaultLeadershipSetupFailures.duration }}
      labels:
        severity: {{ $vaultLeadershipSetupFailures.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: High frequency of Vault leadership setup failures (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "There have been more than 5 Vault leadership setup failures in the past 1h on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultRequestFailures := index (default dict .rules) "vaultRequestFailures" }}
    {{ if (and $vaultRequestFailures (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultRequestFailures.enabled $vaultRequestFailures.severity))) -}}
    - alert: VaultRequestFailures
      expr: increase(vault_audit_log_request_failure{job="{{- $app -}}-stats"}[5m]) > 0
      for: {{ $vaultRequestFailures.duration }}
      labels:
        severity: {{ $vaultRequestFailures.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: High frequency of failed Vault requests (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "There has been an increased number of failed Vault requests in the last 15 minutes on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultResponseFailures := index (default dict .rules) "vaultResponseFailures" }}
    {{ if (and $vaultResponseFailures (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultResponseFailures.enabled $vaultResponseFailures.severity))) -}}
    - alert: VaultResponseFailures
      expr: increase(vault_audit_log_response_failure{job="{{- $app -}}-stats"}[5m]) > 0
      for: {{ $vaultResponseFailures.duration }}
      labels:
        severity: {{ $vaultResponseFailures.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: High frequency of failed Vault responses (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "There has been an increased number of failed Vault response in the last 15 minutes on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $vaultTooManyInfinityTokens := index (default dict .rules) "vaultTooManyInfinityTokens" }}
    {{ if (and $vaultTooManyInfinityTokens (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $vaultTooManyInfinityTokens.enabled $vaultTooManyInfinityTokens.severity))) -}}
    - alert: VaultTooManyInfinityTokens
      expr: vault_token_count_by_ttl{creation_ttl="+Inf",job="{{- $app -}}-stats"} > {{$vaultTooManyInfinityTokens.val}}
      for: {{ $vaultTooManyInfinityTokens.duration }}
      labels:
        severity: {{ $vaultTooManyInfinityTokens.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Vault too many connections (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Vault instance has too many infinity tokens . More than {{$vaultTooManyInfinityTokens.val}} of VaultServer Infinity tokens are in use on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.operator -}}
  {{ if (include "vaultserver-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: vaultserver.operator.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeVaultServerPhaseNotReady
      expr: kubevault_com_vaultserver_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeVault VaultServer Phase NotReady (vaultserver {{`{{`}} $labels.vaultserver {{`}}`}})
        description: "KubeVault Vaultserver Phase not ready on {{`{{`}} $labels.vaultserver {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeVaultServerPhaseCritical
      expr: kubevault_com_vaultserver_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeVault VaultServer Phase Critical (vaultserver {{`{{`}} $labels.vaultserver {{`}}`}})
        description: "KubeVault Vaultserver Phase Critical {{`{{`}} $labels.vaultserver {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "vaultserver-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: vaultserver.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeVaultServerOpsRequestOnProgress
      expr: ops_kubevault_com_vaultopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeVaultServerOpsRequest on progress (vaultopsrequest {{`{{`}} $labels.vaultopsrequest {{`}}`}})
        description: "VaultOpsRequest {{`{{`}} $labels.vaultopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeVaultServerOpsRequestStatusProgressingToLong
      expr: ops_kubevault_com_vaultopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultOpsRequest is in progressing status for too long (vaultopsrequest {{`{{`}} $labels.vaultopsrequest {{`}}`}})
        description: "VaultOpsRequest {{`{{`}} $labels.vaultopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeVaultServerOpsRequestFailed
      expr: ops_kubevault_com_vaultopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultOpsRequest failed (vaultopsrequest {{`{{`}} $labels.vaultopsrequest {{`}}`}})
        description: "VaultOpsRequest {{`{{`}} $labels.vaultopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "vaultserver-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: vaultserver.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: VaultServerStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultServer Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: VaultServerStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultServer Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash restore session failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $noBackupSessionForTooLong := index (default dict .rules) "noBackupSessionForTooLong" }}
    {{ if (and $noBackupSessionForTooLong (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $noBackupSessionForTooLong.enabled $noBackupSessionForTooLong.severity))) -}}
    - alert: VaultServerStashNoBackupSessionForTooLong
      expr: time() - stash_backup_last_success_time_seconds + on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} - 1 > {{ $noBackupSessionForTooLong.val }}
      for: {{ $noBackupSessionForTooLong.duration }}
      labels:
        severity: {{ $noBackupSessionForTooLong.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultServer Stash no backup for last {{ $noBackupSessionForTooLong.val }} second (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash no backup for too long {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryCorrupted := index (default dict .rules) "repositoryCorrupted" }}
    {{ if (and $repositoryCorrupted (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryCorrupted.enabled $repositoryCorrupted.severity))) -}}
    - alert: VaultServerStashRepositoryCorrupted
      expr: stash_repository_integrity * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $repositoryCorrupted.duration }}
      labels:
        severity: {{ $repositoryCorrupted.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultServer Stash repository corrupted (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash repository corrupted {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryStorageRunningLow := index (default dict .rules) "repositoryStorageRunningLow" }}
    {{ if (and $repositoryStorageRunningLow (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryStorageRunningLow.enabled $repositoryStorageRunningLow.severity))) -}}
    - alert: VaultServerStashRepositoryStorageRunningLow
      expr: stash_repository_size_bytes * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} > {{ $repositoryStorageRunningLow.val }}
      for: {{ $repositoryStorageRunningLow.duration }}
      labels:
        severity: {{ $repositoryStorageRunningLow.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: VaultServer Stash Repository storage more than {{ $repositoryStorageRunningLow.val }} byte. (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash Repository storage running low {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $backupSessionPeriodTooLong := index (default dict .rules) "backupSessionPeriodTooLong" }}
    {{ if (and $backupSessionPeriodTooLong (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionPeriodTooLong.enabled $backupSessionPeriodTooLong.severity))) -}}
    - alert: VaultServerStashBackupSessionPeriodTooLong
      expr: stash_backup_session_duration_seconds * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} > {{ $backupSessionPeriodTooLong.val }}
      for: {{ $backupSessionPeriodTooLong.duration }}
      labels:
        severity: {{ $backupSessionPeriodTooLong.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary:  VaultServer Stash backup session took more than {{ $backupSessionPeriodTooLong.val }} second to complete. (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash backup session taking to long to complete {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionPeriodTooLong := index (default dict .rules) "restoreSessionPeriodTooLong" }}
    {{ if (and $restoreSessionPeriodTooLong (include "vaultserver-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionPeriodTooLong.enabled $restoreSessionPeriodTooLong.severity))) -}}
    - alert: VaultServerStashRestoreSessionPeriodTooLong
      expr: stash_restore_session_duration_seconds * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} > {{ $restoreSessionPeriodTooLong.val }}
      for: {{ $restoreSessionPeriodTooLong.duration }}
      labels:
        severity: {{ $restoreSessionPeriodTooLong.severity }}
        {{- include "vaultserver-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary:  VaultServer Stash restore session took more than {{ $restoreSessionPeriodTooLong.val }} second to complete. (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "VaultServer Stash restore session taking to long to complete {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
