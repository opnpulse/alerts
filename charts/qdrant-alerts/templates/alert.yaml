{{ $app := (include "qdrant-alerts.fullname" .) }}

  {{ if (include "qdrant-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "qdrant-alerts.labels" . | nindent 4 }}
  {{- if .Values.form.alert.labels }}
  {{- toYaml .Values.form.alert.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.form.alert.annotations }}
annotations:
  {{- toYaml .Values.form.alert.annotations | nindent 4 }}
  {{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "qdrant-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: qdrant.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $qdrantInstanceDown := index (default dict .rules) "qdrantInstanceDown" }}
    {{ if (and $qdrantInstanceDown (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantInstanceDown.enabled $qdrantInstanceDown.severity))) -}}
    - alert: QdrantInstanceDown
      expr: up{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $qdrantInstanceDown.duration }}
      labels:
        severity: {{ $qdrantInstanceDown.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant instance down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Qdrant database instance is down and not accepting connections. Database read/write operations are failing.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $qdrantPhaseCritical := index (default dict .rules) "qdrantPhaseCritical" }}
    {{ if (and $qdrantPhaseCritical (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantPhaseCritical.enabled $qdrantPhaseCritical.severity))) -}}
    - alert: QdrantPhaseCritical
      expr: kubedb_com_qdrant_status_phase{phase="Critical",app="{{ $.Release.Name }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $qdrantPhaseCritical.duration }}
      labels:
        severity: {{ $qdrantPhaseCritical.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant database in Critical phase (qdrant {{`{{`}} $labels.qdrant {{`}}`}})
        description: "Qdrant database {{`{{`}} $labels.qdrant {{`}}`}} is in Critical phase. One or more database nodes are experiencing issues but the database is still operational.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $qdrantRestarted := index (default dict .rules) "qdrantRestarted" }}
    {{ if (and $qdrantRestarted (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantRestarted.enabled $qdrantRestarted.severity))) -}}
    - alert: QdrantRestarted
      expr: (time() - min(kube_pod_start_time{ namespace="{{ $.Release.Namespace }}", pod=~"{{ $.Release.Name }}-.*"})) < {{$qdrantRestarted.val}}
      for: {{ $qdrantRestarted.duration }}
      labels:
        severity: {{ $qdrantRestarted.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant service recently restarted (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Qdrant service on pod {{`{{`}} $labels.pod {{`}}`}} has restarted within the last 3 minutes. This may indicate a crash or graceful restart.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $qdrantHighCPUUsage := index (default dict .rules) "qdrantHighCPUUsage" }}
    {{ if (and $qdrantHighCPUUsage (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantHighCPUUsage.enabled $qdrantHighCPUUsage.severity))) -}}
    - alert: QdrantHighCPUUsage
      expr: |
        (
          sum by (pod) (
            irate(container_cpu_usage_seconds_total{
              image!="",
              job="kubelet",
              metrics_path="/metrics/cadvisor",
              namespace="{{ $.Release.Namespace }}",
              pod=~"^{{ $.Release.Name }}.*"
            }[5m])
          )
        )
        /
        sum by (pod) (
          kube_pod_container_resource_requests{
            namespace="{{ $.Release.Namespace }}",
            pod=~"^{{ $.Release.Name }}.*",
            resource="cpu"
          }
        ) * 100
        > {{ $qdrantHighCPUUsage.val }}
      for: {{ $qdrantHighCPUUsage.duration }}
      labels:
        severity: {{ $qdrantHighCPUUsage.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant Pod CPU usage high (pod {{`{{`}} $labels.pod {{`}}`}})
        description: "Qdrant pod CPU usage is above {{ $qdrantHighCPUUsage.val }} percent.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $qdrantHighMemoryUsage := index (default dict .rules) "qdrantHighMemoryUsage" }}
    {{ if (and $qdrantHighMemoryUsage (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantHighMemoryUsage.enabled $qdrantHighMemoryUsage.severity))) -}}
    - alert: QdrantHighMemoryUsage
      expr: |
        (
          sum by (pod) (
            container_memory_working_set_bytes{
              namespace="{{ $.Release.Namespace }}",
              pod=~"^{{ $.Release.Name }}.*",
              container!="",
              image!=""
            }
          )
        )
        /
        sum by (pod) (
          kube_pod_container_resource_limits{
            namespace="{{ $.Release.Namespace }}",
            pod=~"^{{ $.Release.Name }}.*",
            resource="memory"
          }
        ) * 100
        > {{ $qdrantHighMemoryUsage.val }}
      for: {{ $qdrantHighMemoryUsage.duration }}
      labels:
        severity: {{ $qdrantHighMemoryUsage.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant Pod Memory usage high (pod {{`{{`}} $labels.pod {{`}}`}})
        description: "Qdrant pod memory usage is above {{ $qdrantHighMemoryUsage.val }} percent.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}

    {{ $qdrantHighPendingOperations := index (default dict .rules) "qdrantHighPendingOperations" }}
    {{ if (and $qdrantHighPendingOperations (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantHighPendingOperations.enabled $qdrantHighPendingOperations.severity))) -}}
    - alert: QdrantHighPendingOperations
      expr: |
        sum by (pod) (
          cluster_pending_operations_total{
            job=~"{{ $.Release.Name }}-stats",
            namespace="{{ $.Release.Namespace }}",
            pod=~"^{{ $.Release.Name }}.*"
          }
        ) > {{ $qdrantHighPendingOperations.val }}
      for: {{ $qdrantHighPendingOperations.duration }}
      labels:
        severity: {{ $qdrantHighPendingOperations.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant pending operations high on pod {{`{{`}} $labels.pod {{`}}`}}
        description: |
          Qdrant pod has too many pending operations.
          VALUE = {{`{{`}} $value {{`}}`}}
          LABELS = {{`{{`}} $labels {{`}}`}}
    {{- end }}

    {{ $qdrantGrpcResponsesFailHigh := index (default dict .rules) "qdrantGrpcResponsesFailHigh" }}
    {{ if (and $qdrantGrpcResponsesFailHigh (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantGrpcResponsesFailHigh.enabled $qdrantGrpcResponsesFailHigh.severity))) -}}
    - alert: QdrantGrpcResponsesFailHigh
      expr: |
        sum by (pod) (
          increase(
            grpc_responses_fail_total{
              job=~"{{ $.Release.Name }}-stats",
              namespace="{{ $.Release.Namespace }}",
              pod=~"^{{ $.Release.Name }}.*"
            }[5m]
          )
        ) > {{ $qdrantGrpcResponsesFailHigh.val }}
      for: {{ $qdrantGrpcResponsesFailHigh.duration }}
      labels:
        severity: {{ $qdrantGrpcResponsesFailHigh.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant gRPC fails high on pod {{`{{`}} $labels.pod {{`}}`}}
        description: |
          The number of failed gRPC responses for this pod in the last 5m exceeds threshold.
          VALUE = {{`{{`}} $value {{`}}`}}
          LABELS = {{`{{`}} $labels {{`}}`}}
    {{- end }}

    {{ $qdrantRestResponsesFailHigh := index (default dict .rules) "qdrantRestResponsesFailHigh" }}
    {{ if (and $qdrantRestResponsesFailHigh (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $qdrantRestResponsesFailHigh.enabled $qdrantRestResponsesFailHigh.severity))) -}}
    - alert: QdrantRestResponsesFailHigh
      expr: |
        sum by (pod) (
          increase(
            rest_responses_fail_total{
              job=~"{{ $.Release.Name }}-stats",
              namespace="{{ $.Release.Namespace }}",
              pod=~"^{{ $.Release.Name }}.*"
            }[5m]
          )
        ) > {{ $qdrantRestResponsesFailHigh.val }}
      for: {{ $qdrantRestResponsesFailHigh.duration }}
      labels:
        severity: {{ $qdrantRestResponsesFailHigh.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Qdrant REST fails high on pod {{`{{`}} $labels.pod {{`}}`}}
        description: |
          The number of failed REST responses for this pod in the last 5m exceeds threshold.
          VALUE = {{`{{`}} $value {{`}}`}}
          LABELS = {{`{{`}} $labels {{`}}`}}
    {{- end }}
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: ( kubelet_volume_stats_used_bytes{job="kubelet", metrics_path="/metrics"} / kubelet_volume_stats_capacity_bytes{job="kubelet", metrics_path="/metrics"} ) * on (persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{ pod=~"{{ $.Release.Name }}-.+$",namespace="{{ $.Release.Namespace }}"} * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume usage high for Qdrant (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Persistent Volume usage is above {{ $diskUsageHigh.val }}%. The storage is running low and may need expansion soon.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: ( kubelet_volume_stats_used_bytes{job="kubelet", metrics_path="/metrics"} / kubelet_volume_stats_capacity_bytes{job="kubelet", metrics_path="/metrics"} ) * on (persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{ pod=~"{{ $.Release.Name }}-.+$",namespace="{{ $.Release.Namespace }}"} * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume almost full for Qdrant (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Persistent Volume usage is above {{ $diskAlmostFull.val }}%. The storage is critically low and immediate action is required to avoid data loss.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{end -}}
  {{end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "qdrant-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: qdrant.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBQdrantPhaseNotReady
      expr: kubedb_com_qdrant_status_phase{phase="NotReady",app="{{ $.Release.Name }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB Qdrant database in NotReady phase (qdrant {{`{{`}} $labels.qdrant {{`}}`}})
        description: "KubeDB Qdrant database {{`{{`}} $labels.qdrant {{`}}`}} is in NotReady phase. The database is not accepting connections and requires attention.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "qdrant-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBQdrantPhaseCritical
      expr: kubedb_com_qdrant_status_phase{phase="Critical",app="{{ $.Release.Name }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "qdrant-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB Qdrant database in Critical phase (qdrant {{`{{`}} $labels.qdrant {{`}}`}})
        description: "KubeDB Qdrant database {{`{{`}} $labels.qdrant {{`}}`}} is in Critical phase. One or more nodes are experiencing issues but the database is still operational.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}

  {{ end }}
