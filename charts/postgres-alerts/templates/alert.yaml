{{ $app := (include "postgres-alerts.fullname" .) }}

{{ if (include "postgres-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "postgres-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "postgres-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: postgres.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $postgresInstanceDown := index (default dict .rules) "postgresInstanceDown" }}
    {{ if (and $postgresInstanceDown (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresInstanceDown.enabled $postgresInstanceDown.severity))) -}}
    - alert: PostgresqlDown
      expr: pg_up{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $postgresInstanceDown.duration }}
      labels:
        severity: {{ $postgresInstanceDown.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgres instance down (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Postgres instance is down on {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{end -}}
    {{ $postgresSplitBrain := index (default dict .rules) "postgresSplitBrain" }}
    {{ if (and $postgresSplitBrain (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresSplitBrain.enabled $postgresSplitBrain.severity))) -}}
    - alert: PostgresqlSplitBrain
      expr: count(pg_replication_is_replica{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} == 0) != 1
      for: {{ $postgresSplitBrain.duration }}
      labels:
        severity: {{ $postgresSplitBrain.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql split brain (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Split Brain, too many primary Postgresql databases in read-write mode\n  {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{end -}}
    {{ $postgresTooManyLocksAcquired := index (default dict .rules) "postgresTooManyLocksAcquired" }}
    {{ if (and $postgresTooManyLocksAcquired (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresTooManyLocksAcquired.enabled $postgresTooManyLocksAcquired.severity))) -}}
    - alert: PostgresqlTooManyLocksAcquired
      expr: ((sum by (pod) (pg_locks_count{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}) ) / ( sum by (pod) (pg_settings_max_locks_per_transaction{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}) * sum by (pod) (pg_settings_max_connections{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}))) > {{$postgresTooManyLocksAcquired.val}}
      for: {{ $postgresTooManyLocksAcquired.duration }}
      labels:
        severity: {{ $postgresTooManyLocksAcquired.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql too many locks acquired (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Too many locks acquired on the database. \n  If this alert happens frequently, we may need to increase the postgres setting max_locks_per_transaction.\n  {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{end -}}
    {{ $PostgresReplicationSlotLagHigh := index (default dict .rules) "PostgresReplicationSlotLagHigh" }}
    {{ if (and $PostgresReplicationSlotLagHigh (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $PostgresReplicationSlotLagHigh.enabled $PostgresReplicationSlotLagHigh.severity))) -}}
    - alert: PostgresReplicationSlotLagHigh
      expr: max_over_time(pg_replication_slots_pg_wal_lsn_diff{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}[{{ $PostgresReplicationSlotLagHigh.duration }}]) > {{ $PostgresReplicationSlotLagHigh.val }}
      for: {{ $PostgresReplicationSlotLagHigh.duration }}
      labels:
        severity: {{ $PostgresReplicationSlotLagHigh.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "High replication slot WAL lag detected on slot {{`{{`}} $labels.slot_name {{`}}`}}"
        description: "The replication lag for slot {{`{{`}} $labels.slot_name {{`}}`}} is {{`{{`}} $value {{`}}`}} bytes, which may cause disk space issues or replication errors. This indicates the replica or consumer might be falling behind."
    {{end -}}
    {{ $PostgresReplicationSlotLagCritical := index (default dict .rules) "PostgresReplicationSlotLagCritical" }}
    {{ if (and $PostgresReplicationSlotLagCritical (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $PostgresReplicationSlotLagCritical.enabled $PostgresReplicationSlotLagCritical.severity))) -}}
    - alert: PostgresReplicationSlotLagCritical
      expr: max_over_time(pg_replication_slots_pg_wal_lsn_diff{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}[{{ $PostgresReplicationSlotLagCritical.duration }}]) > {{ $PostgresReplicationSlotLagCritical.val }}
      for: {{ $PostgresReplicationSlotLagCritical.duration }}
      labels:
        severity: {{ $PostgresReplicationSlotLagCritical.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "Critical PostgreSQL replication lag detected on slot {{`{{`}} $labels.slot_name {{`}}`}}"
        description: "Replication slot {{`{{`}} $labels.slot_name {{`}}`}} is lagging by more than {{`{{`}} $value {{`}}`}} bytes. WAL file deletion is imminent. Immediate intervention required to prevent replication slot invalidation and potential data loss."
    {{end -}}
    {{ $postgresRestarted := index (default dict .rules) "postgresRestarted" }}
    {{ if (and $postgresRestarted (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresRestarted.enabled $postgresRestarted.severity))) -}}
    - alert: PostgresqlRestarted
      expr: time() - pg_postmaster_start_time_seconds{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} < {{ $postgresRestarted.val }}
      for: {{ $postgresRestarted.duration }}
      labels:
        severity: {{ $postgresRestarted.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql restarted (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Postgresql restarted\n  {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{end -}}
    {{ $postgresExporterError := index (default dict .rules) "postgresExporterError" }}
    {{ if (and $postgresExporterError (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresExporterError.enabled $postgresExporterError.severity))) -}}
    - alert: PostgresqlExporterError
      expr: pg_exporter_last_scrape_error{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} > 0
      for: {{ $postgresExporterError.duration }}
      labels:
        severity: {{ $postgresExporterError.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql exporter error (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Postgresql exporter is showing errors. A query may be buggy in query.yaml\n  {{`{{`}} $labels.pod {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{end -}}
    {{ $postgresHighRollbackRate := index (default dict .rules) "postgresHighRollbackRate" }}
    {{ if (and $postgresHighRollbackRate (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresHighRollbackRate.enabled $postgresHighRollbackRate.severity))) -}}
    - alert: PostgresqlHighRollbackRate
      expr: >-
        (
          sum by (pod) (
            rate(pg_stat_database_xact_rollback{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}[5m])
          )
          /
          clamp_min(
            sum by (pod) (
              rate(pg_stat_database_xact_commit{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}[5m])
            ),
            1
          )
        ) > {{ $postgresHighRollbackRate.val }}
        and
        sum by (pod) (
          rate(pg_stat_database_xact_commit{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}[5m])
        ) > 1
      for: {{ $postgresHighRollbackRate.duration }}
      labels:
        severity: {{ $postgresHighRollbackRate.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql high rollback rate (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "Transaction rollback rate is above {{ $postgresHighRollbackRate.val }} on {{`{{`}} $labels.pod {{`}}`}} with enough commit volume to make the ratio meaningful."
    {{end -}}
    {{ $postgresTooManyConnections := index (default dict .rules) "postgresTooManyConnections" }}
    {{ if (and $postgresTooManyConnections (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresTooManyConnections.enabled $postgresTooManyConnections.severity))) -}}
    - alert: PostgresTooManyConnections
      expr: sum by (pod) (pg_stat_activity_count{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"}) >= sum by (pod) (pg_settings_max_connections{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} * {{$postgresTooManyConnections.val}}) / 100
      for: {{ $postgresTooManyConnections.duration }}
      labels:
        severity: {{ $postgresTooManyConnections.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql too many connections (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PostgreSQL instance is using at least {{$postgresTooManyConnections.val}}% of available connections on {{`{{`}} $labels.pod {{`}}`}}."
    {{- end }}
    {{ $postgresSlowQueries := index (default dict .rules) "postgresSlowQueries" }}
    {{ if (and $postgresSlowQueries (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $postgresSlowQueries.enabled $postgresSlowQueries.severity))) -}}
    - alert: PostgresqlSlowQueries
      expr: pg_stat_activity_max_tx_duration{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}",state="active"} > {{ $postgresSlowQueries.val }}
      for: {{ $postgresSlowQueries.duration }}
      labels:
        severity: {{ $postgresSlowQueries.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Postgresql slow queries (instance {{`{{`}} $labels.pod {{`}}`}})
        description: "PostgreSQL has a transaction running longer than {{ $postgresSlowQueries.val }}s on {{`{{`}} $labels.pod {{`}}`}}.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: >-
        (
          100 * kubelet_volume_stats_used_bytes{job="kubelet",namespace="{{ $.Release.Namespace }}"}
          /
          on(namespace, persistentvolumeclaim)
          kubelet_volume_stats_capacity_bytes{job="kubelet",namespace="{{ $.Release.Namespace }}"}
        )
        * on(namespace, persistentvolumeclaim) group_left(pod)
        max by (namespace, persistentvolumeclaim, pod) (
          kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="{{ $.Release.Namespace }}",pod=~"{{ $.Release.Name }}-[0-9]+$"}
        )
        > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent volume usage for {{`{{`}} $labels.pod {{`}}`}} is above the warning threshold."
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: >-
        (
          100 * kubelet_volume_stats_used_bytes{job="kubelet",namespace="{{ $.Release.Namespace }}"}
          /
          on(namespace, persistentvolumeclaim)
          kubelet_volume_stats_capacity_bytes{job="kubelet",namespace="{{ $.Release.Namespace }}"}
        )
        * on(namespace, persistentvolumeclaim) group_left(pod)
        max by (namespace, persistentvolumeclaim, pod) (
          kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="{{ $.Release.Namespace }}",pod=~"{{ $.Release.Name }}-[0-9]+$"}
        )
        > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent volume usage for {{`{{`}} $labels.pod {{`}}`}} is above the critical threshold."
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "postgres-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: postgres.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBPostgreSQLPhaseNotReady
      expr: kubedb_com_postgres_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB PostgreSQL Phase NotReady (postgres {{`{{`}} $labels.postgres {{`}}`}})
        description: "KubeDB PostgreSQL Phase not ready on {{`{{`}} $labels.postgres {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBPostgreSQLPhaseCritical
      expr: kubedb_com_postgres_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB PostgreSQL Phase Critical (postgres {{`{{`}} $labels.postgres {{`}}`}})
        description: "KubeDB PostgreSQL Phase Critical {{`{{`}} $labels.postgres {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "postgres-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: postgres.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeDBPostgreSQLOpsRequestOnProgress
      expr: ops_kubedb_com_postgresopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQLOpsRequest on progress (postgresopsrequest {{`{{`}} $labels.postgresopsrequest {{`}}`}})
        description: "PostgresOpsRequest {{`{{`}} $labels.postgresopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeDBPostgreSQLOpsRequestStatusProgressingToLong
      expr: ops_kubedb_com_postgresopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQLOpsRequest is in progressing status for too long (postgresopsrequest {{`{{`}} $labels.postgresopsrequest {{`}}`}})
        description: "PostgresOpsRequest {{`{{`}} $labels.postgresopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeDBPostgreSQLOpsRequestFailed
      expr: ops_kubedb_com_postgresopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQLOpsRequest failed (postgresopsrequest {{`{{`}} $labels.postgresopsrequest {{`}}`}})
        description: "PostgresOpsRequest {{`{{`}} $labels.postgresopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "postgres-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: postgres.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: PostgreSQLStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQL Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PostgreSQL Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: PostgreSQLStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQL Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PostgreSQL Stash restore session failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $noBackupSessionForTooLong := index (default dict .rules) "noBackupSessionForTooLong" }}
    {{ if (and $noBackupSessionForTooLong (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $noBackupSessionForTooLong.enabled $noBackupSessionForTooLong.severity))) -}}
    - alert: PostgreSQLStashNoBackupSessionForTooLong
      expr: time() - stash_backup_last_success_time_seconds + on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} - 1 > {{ $noBackupSessionForTooLong.val }}
      for: {{ $noBackupSessionForTooLong.duration }}
      labels:
        severity: {{ $noBackupSessionForTooLong.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQL Stash no backup for last {{ $noBackupSessionForTooLong.val }} second (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PostgreSQL Stash no backup for too long {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryCorrupted := index (default dict .rules) "repositoryCorrupted" }}
    {{ if (and $repositoryCorrupted (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryCorrupted.enabled $repositoryCorrupted.severity))) -}}
    - alert: PostgreSQLStashRepositoryCorrupted
      expr: stash_repository_integrity * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $repositoryCorrupted.duration }}
      labels:
        severity: {{ $repositoryCorrupted.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQL Stash repository corrupted (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PostgreSQL Stash repository corrupted {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryStorageRunningLow := index (default dict .rules) "repositoryStorageRunningLow" }}
    {{ if (and $repositoryStorageRunningLow (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryStorageRunningLow.enabled $repositoryStorageRunningLow.severity))) -}}
    - alert: PostgreSQLStashRepositoryStorageRunningLow
      expr: stash_repository_size_bytes * on(invoker_name, invoker_kind) group_left(target_name, target_kind, repository) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} > {{ $repositoryStorageRunningLow.val }}
      for: {{ $repositoryStorageRunningLow.duration }}
      labels:
        severity: {{ $repositoryStorageRunningLow.severity }}
        {{- include "postgres-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: PostgreSQL Stash Repository storage more than {{ $repositoryStorageRunningLow.val }} byte. (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "PostgreSQL Stash Repository storage running low {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $backupSessionPeriodTooLong := index (default dict .rules) "backupSessionPeriodTooLong" }}
    {{ if (and $backupSessionPeriodTooLong (include "postgres-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionPeriodTooLong.enabled $backupSessionPeriodTooLong.severity))) -}}
    - alert: PostgreSQLStashBackupSessionPeriodTooLong
