{{ $app := (include "milvus-alerts.fullname" .) }}

{{ if (include "milvus-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "milvus-alerts.labels" . | nindent 4 }}
    {{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
    {{- end }}
  {{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
  {{- end }}
spec:
  groups:
    {{- with .Values.form.alert.groups.database }}
    {{- if (include "milvus-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
    - name: milvus.database.{{ $.Release.Namespace }}.{{ $app }}.rules
      rules:
        {{ $milvusHighCPUUsage := index (default dict .rules) "milvusHighCPUUsage" }}
        {{ if (and $milvusHighCPUUsage (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusHighCPUUsage.enabled $milvusHighCPUUsage.severity))) -}}
        - alert: MilvusHighCPUUsage
          expr: avg(irate(container_cpu_usage_seconds_total{pod=~"{{ $.Release.Name }}.*",namespace=~"{{ $.Release.Namespace }}"}[5m])) by (pod) * 100 > {{ $milvusHighCPUUsage.val }}
          for: {{ $milvusHighCPUUsage.duration }}
          labels:
            severity: {{ $milvusHighCPUUsage.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: High CPU usage on Milvus pods (pod {{`{{`}} $labels.pod {{`}}`}})
            description: |
              CPU usage percentage is {{`{{`}} $value {{`}}`}}%.
              VALUE = {{`{{`}} $value {{`}}`}}
              LABELS = {{`{{`}} $labels {{`}}`}}
        {{- end }}

        {{ $milvusHighMemoryUsage := index (default dict .rules) "milvusHighMemoryUsage" }}
        {{ if (and $milvusHighMemoryUsage (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusHighMemoryUsage.enabled $milvusHighMemoryUsage.severity))) -}}
        - alert: MilvusHighMemoryUsage
          expr: avg(container_memory_working_set_bytes{pod=~"{{ $.Release.Name }}.*",namespace=~"{{ $.Release.Namespace }}"}) by (pod) / avg(kube_pod_container_resource_limits{resource="memory",pod=~"{{ $.Release.Name }}.*",namespace=~"{{ $.Release.Namespace }}"}) by (pod) * 100 > {{ $milvusHighMemoryUsage.val }}
          for: {{ $milvusHighMemoryUsage.duration }}
          labels:
            severity: {{ $milvusHighMemoryUsage.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: High memory usage on Milvus pods (pod {{`{{`}} $labels.pod {{`}}`}})
            description: |
              Memory usage percentage is {{`{{`}} $value {{`}}`}}%.
              VALUE = {{`{{`}} $value {{`}}`}}
              LABELS = {{`{{`}} $labels {{`}}`}}
        {{- end }}

        {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
        {{ if (and $diskUsageHigh (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
        - alert: DiskUsageHigh
          expr: 100 * kubelet_volume_stats_used_bytes{namespace=~"{{ $.Release.Namespace }}"} / on(persistentvolumeclaim, namespace) group_left(pod) kubelet_volume_stats_capacity_bytes{namespace=~"{{ $.Release.Namespace }}"} > {{ $diskUsageHigh.val }}
          for: {{ $diskUsageHigh.duration }}
          labels:
            severity: {{ $diskUsageHigh.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Persistent Volume usage is high (instance {{`{{`}} $labels.instance {{`}}`}})
            description: |
              Persistent Volume usage is {{`{{`}} $value {{`}}`}}%.
              Consider expanding the volume.
              VALUE = {{`{{`}} $value {{`}}`}}
              LABELS = {{`{{`}} $labels {{`}}`}}
        {{- end }}

        {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
        {{ if (and $diskAlmostFull (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
        - alert: DiskAlmostFull
          expr: 100 * kubelet_volume_stats_used_bytes{namespace=~"{{ $.Release.Namespace }}"} / on(persistentvolumeclaim, namespace) group_left(pod) kubelet_volume_stats_capacity_bytes{namespace=~"{{ $.Release.Namespace }}"} > {{ $diskAlmostFull.val }}
          for: {{ $diskAlmostFull.duration }}
          labels:
            severity: {{ $diskAlmostFull.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Persistent Volume is almost full (instance {{`{{`}} $labels.instance {{`}}`}})
            description: |
              Persistent Volume usage is {{`{{`}} $value {{`}}`}}%.
              Urgent: Expand the volume immediately.
              VALUE = {{`{{`}} $value {{`}}`}}
              LABELS = {{`{{`}} $labels {{`}}`}}
        {{- end }}

        {{ $milvusInstanceDown := index (default dict .rules) "milvusInstanceDown" }}
        {{ if (and $milvusInstanceDown (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusInstanceDown.enabled $milvusInstanceDown.severity))) -}}
        - alert: MilvusInstanceDown
          expr: up{job="{{- $app -}}-stats",namespace="{{ $.Release.Namespace }}"} == 0
          for: {{ $milvusInstanceDown.duration }}
          labels:
            severity: {{ $milvusInstanceDown.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Milvus instance down (instance {{`{{`}} $labels.pod {{`}}`}})
            description: "Milvus database instance is down and not accepting connections. Database read/write operations are failing.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
        {{- end }}

        {{ $milvusRestarted := index (default dict .rules) "milvusRestarted" }}
        {{ if (and $milvusRestarted (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusRestarted.enabled $milvusRestarted.severity))) -}}
        - alert: MilvusRestarted
          expr: (time() - min(kube_pod_start_time{ namespace="{{ $.Release.Namespace }}", pod=~"{{ $app }}.*"})) < {{$milvusRestarted.val}}
          for: {{ $milvusRestarted.duration }}
          labels:
            severity: {{ $milvusRestarted.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Milvus service recently restarted (instance {{`{{`}} $labels.pod {{`}}`}})
            description: "Milvus service on pod {{`{{`}} $labels.pod {{`}}`}} has restarted within the last 3 minutes. This may indicate a crash or graceful restart.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
        {{- end }}

        {{ $milvusHighProcessMemoryUsage := index (default dict .rules) "milvusHighProcessMemoryUsage" }}
        {{ if (and $milvusHighProcessMemoryUsage (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusHighProcessMemoryUsage.enabled $milvusHighProcessMemoryUsage.severity))) -}}
        - alert: MilvusHighProcessMemoryUsage
          expr: process_resident_memory_bytes{namespace="{{ $.Release.Namespace }}", pod=~"{{ $app }}.*"} > {{ $milvusHighProcessMemoryUsage.val }}
          for: {{ $milvusHighProcessMemoryUsage.duration }}
          labels:
            severity: {{ $milvusHighProcessMemoryUsage.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Milvus high process memory usage (instance {{`{{`}} $labels.pod {{`}}`}})
            description: "Milvus process on pod {{`{{`}} $labels.pod {{`}}`}} is using high resident memory.\n  VALUE = {{`{{`}} $value {{`}}`}} bytes\n  LABELS = {{`{{`}} $labels {{`}}`}}"
        {{- end }}

        {{ $milvusGoroutinesExplosion := index (default dict .rules) "milvusGoroutinesExplosion" }}
        {{ if (and $milvusGoroutinesExplosion (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusGoroutinesExplosion.enabled $milvusGoroutinesExplosion.severity))) -}}
        - alert: MilvusGoroutinesExplosion
          expr: go_goroutines{namespace="{{ $.Release.Namespace }}", pod=~"{{ $app }}.*"} > {{ $milvusGoroutinesExplosion.val }}
          for: {{ $milvusGoroutinesExplosion.duration }}
          labels:
            severity: {{ $milvusGoroutinesExplosion.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Milvus high goroutine count (instance {{`{{`}} $labels.pod {{`}}`}})
            description: "Milvus process on pod {{`{{`}} $labels.pod {{`}}`}} ({{`{{`}} $labels.instance {{`}}`}}) has a high number of goroutines. This may indicate excessive concurrency or a possible goroutine leak.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
        {{- end }}

        {{ $milvusHighThreadPressure := index (default dict .rules) "milvusHighThreadPressure" }}
        {{ if (and $milvusHighThreadPressure (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusHighThreadPressure.enabled $milvusHighThreadPressure.severity))) -}}
        - alert: MilvusHighThreadPressure
          expr: go_threads{namespace="{{ $.Release.Namespace }}", pod=~"{{ $app }}.*"} > {{ $milvusHighThreadPressure.val }}
          for: {{ $milvusHighThreadPressure.duration }}
          labels:
            severity: {{ $milvusHighThreadPressure.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Milvus high thread count (instance {{`{{`}} $labels.pod {{`}}`}})
            description: "Milvus process on pod {{`{{`}} $labels.pod {{`}}`}} ({{`{{`}} $labels.instance {{`}}`}}) has a high number of OS threads. This may indicate heavy parallel workload or thread contention.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
        {{- end }}

        {{ $milvusHighFDsUsage := index (default dict .rules) "milvusHighFDsUsage" }}
        {{ if (and $milvusHighFDsUsage (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $milvusHighFDsUsage.enabled $milvusHighFDsUsage.severity))) -}}
        - alert: MilvusHighFDsUsage
          expr: process_open_fds{namespace="{{ $.Release.Namespace }}", pod=~"{{ $app }}.*"} > {{ $milvusHighFDsUsage.val }}
          for: {{ $milvusHighFDsUsage.duration }}
          labels:
            severity: {{ $milvusHighFDsUsage.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: Milvus high open file descriptors (instance {{`{{`}} $labels.pod {{`}}`}})
            description: "Milvus process on pod {{`{{`}} $labels.pod {{`}}`}} ({{`{{`}} $labels.instance {{`}}`}}) has a high number of open file descriptors. This may indicate too many open files or network connections.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
        {{- end }}
    {{- end }}
    {{- end }}

    {{- with .Values.form.alert.groups.provisioner }}
    {{- if (include "milvus-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
    - name: milvus.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
      rules:
        {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
        {{ if (and $appPhaseNotReady (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
        - alert: KubeDBMilvusPhaseNotReady
          expr: kubedb_com_milvus_status_phase{phase="NotReady",app="{{ $app }}",app_namespace="{{ $.Release.Namespace }}"} == 1
          for: {{ $appPhaseNotReady.duration }}
          labels:
            severity: {{ $appPhaseNotReady.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: KubeDB Milvus Phase NotReady (milvus {{`{{`}} $labels.milvus {{`}}`}})
            description: |
              KubeDB Milvus Phase not ready on {{`{{`}} $labels.milvus {{`}}`}}.
              The database provisioning or initialization is not complete.
              VALUE = {{`{{`}} $value {{`}}`}}
              LABELS = {{`{{`}} $labels {{`}}`}}
        {{- end }}

        {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
        {{ if (and $appPhaseCritical (include "milvus-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
        - alert: KubeDBMilvusPhaseCritical
          expr: kubedb_com_milvus_status_phase{phase="Critical",app="{{ $app }}",app_namespace="{{ $.Release.Namespace }}"} == 1
          for: {{ $appPhaseCritical.duration }}
          labels:
            severity: {{ $appPhaseCritical.severity }}
            {{- include "milvus-alerts.alertLabels" $ | nindent 12 }}
          annotations:
            summary: KubeDB Milvus Phase Critical (milvus {{`{{`}} $labels.milvus {{`}}`}})
            description: |
              KubeDB Milvus is in Critical phase on {{`{{`}} $labels.milvus {{`}}`}}.
              One or more nodes are not functioning properly.
              VALUE = {{`{{`}} $value {{`}}`}}
              LABELS = {{`{{`}} $labels {{`}}`}}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}