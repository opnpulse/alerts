{{ $app := (include "b3-alerts.fullname" .) }}
{{ $job := .Values.grafana.jobName }}
{{ if (include "b3-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "b3-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  # ===========================================
  # Process & Runtime Alerts
  # ===========================================
{{- with .Values.form.alert.groups.process }}
{{- if (include "b3-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: b3.process.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $b3Down := index (default dict .rules) "b3Down" }}
    {{ if (and $b3Down (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3Down.enabled $b3Down.severity))) -}}
    - alert: B3Down
      expr: >-
        up{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} == 0
        or absent_over_time(up{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[2m])
      for: {{ $b3Down.duration }}
      labels:
        severity: {{ $b3Down.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 target is down or missing from Prometheus scrapes"
        description: "Prometheus has not observed a healthy B3 scrape target for job {{`{{`}} $labels.job {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}}."
{{- end }}
    {{ $b3ReplicasNotReady := index (default dict .rules) "b3ReplicasNotReady" }}
    {{ if (and $b3ReplicasNotReady (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3ReplicasNotReady.enabled $b3ReplicasNotReady.severity))) -}}
    - alert: B3ReplicasNotReady
      expr: >-
        max(kube_statefulset_status_replicas_ready{namespace="{{ $.Release.Namespace }}",statefulset="{{ $app }}"})
        <
        max(kube_statefulset_replicas{namespace="{{ $.Release.Namespace }}",statefulset="{{ $app }}"})
      for: {{ $b3ReplicasNotReady.duration }}
      labels:
        severity: {{ $b3ReplicasNotReady.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 StatefulSet has fewer ready replicas than desired"
        description: "The B3 StatefulSet {{ $app }} has fewer ready replicas than desired in namespace {{ $.Release.Namespace }}."
{{- end }}
    {{ $b3HighGcPauseDuration := index (default dict .rules) "b3HighGcPauseDuration" }}
    {{ if (and $b3HighGcPauseDuration (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighGcPauseDuration.enabled $b3HighGcPauseDuration.severity))) -}}
    - alert: B3HighGcPauseDuration
      expr: >-
        go_gc_duration_seconds{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",quantile=~"1|1.0"} > {{ $b3HighGcPauseDuration.val }}
      for: {{ $b3HighGcPauseDuration.duration }}
      labels:
        severity: {{ $b3HighGcPauseDuration.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 target has high GC pause duration"
        description: "A B3 scrape target has GC pause duration above {{ $b3HighGcPauseDuration.val }}s."
{{- end }}
    {{ $b3HighFileDescriptorUsage := index (default dict .rules) "b3HighFileDescriptorUsage" }}
    {{ if (and $b3HighFileDescriptorUsage (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighFileDescriptorUsage.enabled $b3HighFileDescriptorUsage.severity))) -}}
    - alert: B3HighFileDescriptorUsage
      expr: >-
        (process_open_fds{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} / process_max_fds{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}) * 100 > {{ $b3HighFileDescriptorUsage.val }}
      for: {{ $b3HighFileDescriptorUsage.duration }}
      labels:
        severity: {{ $b3HighFileDescriptorUsage.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 target has high file descriptor usage"
        description: "A B3 scrape target is using more than {{ $b3HighFileDescriptorUsage.val }}% of available file descriptors."
{{- end }}
{{- end }}
{{- end }}

  # ===========================================
  # HTTP Server Alerts
  # ===========================================
{{- with .Values.form.alert.groups.http }}
{{- if (include "b3-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: b3.http.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $b3HighHttpErrorRate := index (default dict .rules) "b3HighHttpErrorRate" }}
    {{ if (and $b3HighHttpErrorRate (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighHttpErrorRate.enabled $b3HighHttpErrorRate.severity))) -}}
    - alert: B3HighHttpErrorRate
      expr: |
        (
          sum(rate(b3_http_server_request_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(b3_http_server_request_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m]))
        ) * 100 > {{ $b3HighHttpErrorRate.val }}
      for: {{ $b3HighHttpErrorRate.duration }}
      labels:
        severity: {{ $b3HighHttpErrorRate.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high HTTP error rate"
        description: "B3 HTTP 5xx error rate is above {{ $b3HighHttpErrorRate.val }}%."
{{- end }}
    {{ $b3HighHttpLatency := index (default dict .rules) "b3HighHttpLatency" }}
    {{ if (and $b3HighHttpLatency (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighHttpLatency.enabled $b3HighHttpLatency.severity))) -}}
    - alert: B3HighHttpLatency
      expr: histogram_quantile(0.99, sum(rate(b3_http_server_request_duration_bucket{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m])) by (le)) > {{ $b3HighHttpLatency.val }}
      for: {{ $b3HighHttpLatency.duration }}
      labels:
        severity: {{ $b3HighHttpLatency.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high HTTP latency"
        description: "B3 HTTP request p99 latency is above {{ $b3HighHttpLatency.val }}s."
{{- end }}
{{- end }}
{{- end }}

  # ===========================================
  # Database Alerts
  # ===========================================
{{- with .Values.form.alert.groups.database }}
{{- if (include "b3-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: b3.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $b3HighDatabaseErrorRate := index (default dict .rules) "b3HighDatabaseErrorRate" }}
    {{ if (and $b3HighDatabaseErrorRate (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighDatabaseErrorRate.enabled $b3HighDatabaseErrorRate.severity))) -}}
    - alert: B3HighDatabaseErrorRate
      expr: |
        (
          sum(rate(b3_db_client_operation_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",error="true"}[5m]))
          /
          sum(rate(b3_db_client_operation_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m]))
        ) * 100 > {{ $b3HighDatabaseErrorRate.val }}
      for: {{ $b3HighDatabaseErrorRate.duration }}
      labels:
        severity: {{ $b3HighDatabaseErrorRate.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high database error rate"
        description: "B3 database error rate is above {{ $b3HighDatabaseErrorRate.val }}%."
{{- end }}
    {{ $b3HighDatabaseLatency := index (default dict .rules) "b3HighDatabaseLatency" }}
    {{ if (and $b3HighDatabaseLatency (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighDatabaseLatency.enabled $b3HighDatabaseLatency.severity))) -}}
    - alert: B3HighDatabaseLatency
      expr: histogram_quantile(0.99, sum(rate(b3_db_client_operation_duration_bucket{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m])) by (le, db_system)) > {{ $b3HighDatabaseLatency.val }}
      for: {{ $b3HighDatabaseLatency.duration }}
      labels:
        severity: {{ $b3HighDatabaseLatency.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high database latency ({{`{{`}} $labels.db_system {{`}}`}})"
        description: "B3 database {{`{{`}} $labels.db_system {{`}}`}} p99 latency is above {{ $b3HighDatabaseLatency.val }}s."
{{- end }}
    {{ $b3DatabaseConnectionErrors := index (default dict .rules) "b3DatabaseConnectionErrors" }}
    {{ if (and $b3DatabaseConnectionErrors (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3DatabaseConnectionErrors.enabled $b3DatabaseConnectionErrors.severity))) -}}
    - alert: B3DatabaseConnectionErrors
      expr: sum(rate(b3_db_client_connection_error_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m])) * 60 > {{ $b3DatabaseConnectionErrors.val }}
      for: {{ $b3DatabaseConnectionErrors.duration }}
      labels:
        severity: {{ $b3DatabaseConnectionErrors.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 database connection errors"
        description: "B3 is experiencing more than {{ $b3DatabaseConnectionErrors.val }} database connection errors per minute."
{{- end }}
    {{ $b3HighDatabaseConnectionPoolUsage := index (default dict .rules) "b3HighDatabaseConnectionPoolUsage" }}
    {{ if (and $b3HighDatabaseConnectionPoolUsage (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighDatabaseConnectionPoolUsage.enabled $b3HighDatabaseConnectionPoolUsage.severity))) -}}
    - alert: B3HighDatabaseConnectionPoolUsage
      expr: |
        (
          sum(b3_db_connections_active{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"})
          /
          sum(b3_db_connections_limit{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"})
        ) * 100 > {{ $b3HighDatabaseConnectionPoolUsage.val }}
      for: {{ $b3HighDatabaseConnectionPoolUsage.duration }}
      labels:
        severity: {{ $b3HighDatabaseConnectionPoolUsage.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high database connection pool usage"
        description: "B3 database connection pool usage is above {{ $b3HighDatabaseConnectionPoolUsage.val }}%."
{{- end }}
{{- end }}
{{- end }}

  # ===========================================
  # Authentication/Authorization Alerts
  # ===========================================
{{- with .Values.form.alert.groups.auth }}
{{- if (include "b3-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: b3.auth.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $b3HighAuthzDenialRate := index (default dict .rules) "b3HighAuthzDenialRate" }}
    {{ if (and $b3HighAuthzDenialRate (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighAuthzDenialRate.enabled $b3HighAuthzDenialRate.severity))) -}}
    - alert: B3HighAuthzDenialRate
      expr: |
        (
          sum(rate(b3_authz_check_denied_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m]))
          /
          sum(rate(b3_authz_check_count{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m]))
        ) * 100 > {{ $b3HighAuthzDenialRate.val }}
      for: {{ $b3HighAuthzDenialRate.duration }}
      labels:
        severity: {{ $b3HighAuthzDenialRate.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high authorization denial rate"
        description: "B3 authorization denial rate is above {{ $b3HighAuthzDenialRate.val }}%."
{{- end }}
{{- end }}
{{- end }}

  # ===========================================
  # Storage/BlobFS Alerts
  # ===========================================
{{- with .Values.form.alert.groups.storage }}
{{- if (include "b3-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: b3.storage.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $b3HighBlobStorageErrorRate := index (default dict .rules) "b3HighBlobStorageErrorRate" }}
    {{ if (and $b3HighBlobStorageErrorRate (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighBlobStorageErrorRate.enabled $b3HighBlobStorageErrorRate.severity))) -}}
    - alert: B3HighBlobStorageErrorRate
      expr: |
        (
          sum(rate(b3_blobfs_operations_total{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",success="false"}[5m]))
          /
          sum(rate(b3_blobfs_operations_total{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m]))
        ) * 100 > {{ $b3HighBlobStorageErrorRate.val }}
      for: {{ $b3HighBlobStorageErrorRate.duration }}
      labels:
        severity: {{ $b3HighBlobStorageErrorRate.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high blob storage error rate"
        description: "B3 blob storage error rate is above {{ $b3HighBlobStorageErrorRate.val }}%."
{{- end }}
{{- end }}
{{- end }}

  # ===========================================
  # Proxy/K8s Operations Alerts
  # ===========================================
{{- with .Values.form.alert.groups.proxy }}
{{- if (include "b3-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: b3.proxy.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $b3HighProxyErrorRate := index (default dict .rules) "b3HighProxyErrorRate" }}
    {{ if (and $b3HighProxyErrorRate (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighProxyErrorRate.enabled $b3HighProxyErrorRate.severity))) -}}
    - alert: B3HighProxyErrorRate
      expr: |
        (
          sum(rate(b3_proxy_k8s_operation_total{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",proxy_request_status_code=~"5.."}[5m]))
          /
          sum(rate(b3_proxy_k8s_operation_total{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m]))
        ) * 100 > {{ $b3HighProxyErrorRate.val }}
      for: {{ $b3HighProxyErrorRate.duration }}
      labels:
        severity: {{ $b3HighProxyErrorRate.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high K8s proxy error rate"
        description: "B3 Kubernetes proxy error rate is above {{ $b3HighProxyErrorRate.val }}%."
{{- end }}
    {{ $b3HighProxyLatency := index (default dict .rules) "b3HighProxyLatency" }}
    {{ if (and $b3HighProxyLatency (include "b3-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $b3HighProxyLatency.enabled $b3HighProxyLatency.severity))) -}}
    - alert: B3HighProxyLatency
      expr: histogram_quantile(0.99, sum(rate(b3_proxy_request_duration_bucket{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[5m])) by (le, proxy_k8s_cluster)) > {{ $b3HighProxyLatency.val }}
      for: {{ $b3HighProxyLatency.duration }}
      labels:
        severity: {{ $b3HighProxyLatency.severity }}
        {{- include "b3-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "B3 high K8s proxy latency (cluster {{`{{`}} $labels.proxy_k8s_cluster {{`}}`}})"
        description: "B3 Kubernetes proxy p99 latency for cluster {{`{{`}} $labels.proxy_k8s_cluster {{`}}`}} is above {{ $b3HighProxyLatency.val }}s."
{{- end }}
{{- end }}
{{- end }}
{{ end }}
