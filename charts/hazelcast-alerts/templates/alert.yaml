{{ $app := (include "hazelcast-alerts.fullname" .) }}

{{ if (include "hazelcast-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hazelcast-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "hazelcast-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: hazelcast.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $hazelcastPartitionCountExceed := index (default dict .rules) "hazelcastPartitionCountExceed" }}
    {{ if (and $hazelcastPartitionCountExceed (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastPartitionCountExceed.enabled $hazelcastPartitionCountExceed.severity))) -}}
    - alert: hazelcastPartitionCountExceed
      expr:  com_hazelcast_Metrics_activePartitionCount{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"} > {{ $hazelcastPartitionCountExceed.val }}
      for: {{ $hazelcastPartitionCountExceed.duration }}
      labels:
        severity: {{ $hazelcastPartitionCountExceed.severity }}
      {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Maximum number of partition can be 95
        description: "Data structures in Hazelcast are divided into multiple partitions\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $hazelcastHighHeapPercentage := index (default dict .rules) "hazelcastHighHeapPercentage" }}
    {{ if (and $hazelcastHighHeapPercentage (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastHighHeapPercentage.enabled $hazelcastHighHeapPercentage.severity))) -}}
    - alert: hazelcastHighHeapPercentage
      expr: com_hazelcast_Metrics_usedHeap{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}/(com_hazelcast_Metrics_usedHeap{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}+com_hazelcast_Metrics_freeHeap{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"})*100 > {{ $hazelcastHighHeapPercentage.val }}
      for: {{ $hazelcastHighHeapPercentage.duration }}
      labels:
        severity: {{ $hazelcastHighHeapPercentage.severity }}
      {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Hazelcast heap size keeps changing (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Hazelcast heap size keeps changing \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $hazelcastHighMemoryUsage := index (default dict .rules) "hazelcastHighMemoryUsage" }}
    {{ if (and $hazelcastHighMemoryUsage (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastHighMemoryUsage.enabled $hazelcastHighMemoryUsage.severity))) -}}
    - alert: hazelcastHighMemoryUsage
      expr:  com_hazelcast_Metrics_usedMemory{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}/com_hazelcast_Metrics_totalMemory{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}*100 > {{ $hazelcastHighMemoryUsage.val }}
      for: {{ $hazelcastHighMemoryUsage.duration }}
      labels:
        severity: {{ $hazelcastHighMemoryUsage.severity }}
      {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Memory usage should not exceed 80% (instance {{`{{`}} $labels.instance {{`}}`}})
        description: " Memory usage should not exceed 80%"
    {{- end }}
    {{ $hazelcastHighPhysicalMemoryUsage := index (default dict .rules) "hazelcastHighPhysicalMemoryUsage" }}
    {{ if (and $hazelcastHighPhysicalMemoryUsage (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastHighPhysicalMemoryUsage.enabled $hazelcastHighPhysicalMemoryUsage.severity))) -}}
    - alert: hazelcastHighPhysicalMemoryUsage
      expr:  (com_hazelcast_Metrics_totalPhysicalMemorySize{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}-com_hazelcast_Metrics_freePhysicalMemorySize{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"})/com_hazelcast_Metrics_totalPhysicalMemorySize{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}*100 > {{ $hazelcastHighPhysicalMemoryUsage.val}}
      for: {{ $hazelcastHighPhysicalMemoryUsage.duration }}
      labels:
        severity: {{ $hazelcastHighPhysicalMemoryUsage.severity }}
      {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary:  More than 50% of physical memory should not be occupied (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "More than 50% of physical memory should not be occupied \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $hazelcastHighLatency := index (default dict .rules) "hazelcastHighLatency" }}
    {{ if (and $hazelcastHighLatency (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastHighLatency.enabled $hazelcastHighLatency.severity))) -}}
    - alert: hazelcastHighLatency
      expr: com_hazelcast_Metrics_totalGetLatency{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"}/100 > {{ $hazelcastHighLatency.val}}
      for: {{ $hazelcastHighLatency.duration }}
      labels:
        severity: {{ $hazelcastHighLatency.severity }}
      {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary:  Get latency should be less than 2.5 (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Getlatency should be less than 2.5\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $hazelcastSystemCPULoadExceed := index (default dict .rules) "hazelcastSystemCPULoadExceed" }}
    {{ if (and $hazelcastSystemCPULoadExceed (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastSystemCPULoadExceed.enabled $hazelcastSystemCPULoadExceed.severity))) -}}
    - alert: hazelcastSystemCPULoadExceed
      expr: com_hazelcast_Metrics_systemCpuLoad{namespace=~"{{ $.Release.Namespace }}",service=~"$app-stats"} > {{ $hazelcastSystemCPULoadExceed.val }}
      for: {{ $hazelcastSystemCPULoadExceed.duration }}
      labels:
        severity: {{ $hazelcastSystemCPULoadExceed.severity }}
      {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Hazelcast system cpu load should not exceed 5 (instance {{`{{`}} $labels.instance {{`}}`}})
        description: " Hazelcast system cpu load should not exceed 5\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $hazelcastPhaseCritical := index (default dict .rules) "hazelcastPhaseCritical" }}
    {{ if (and $hazelcastPhaseCritical (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastPhaseCritical.enabled $hazelcastPhaseCritical.severity))) -}}
    - alert: hazelcastPhaseCritical
      expr: kubedb_com_hazelcast_status_phase{app="{{ $app }}", namespace="{{ $.Release.Namespace }}",phase="Critical"} >= 1
      for: {{ $hazelcastPhaseCritical.duration }}
      labels:
        severity: {{ $hazelcastPhaseCritical.severity }}
        {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: hazelcast database is in Critical state (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Database in Critical state, one or more database nodes are not working properly.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $hazelcastDown := index (default dict .rules) "hazelcastDown" }}
    {{ if (and $hazelcastDown (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $hazelcastDown.enabled $hazelcastDown.severity))) -}}
    - alert: hazelcastDown
      expr: kubedb_com_hazelcast_status_phase{app="{{ $app }}", namespace="{{ $.Release.Namespace }}",phase="NotReady"} >= 1
      for: {{ $hazelcastDown.duration }}
      labels:
        severity: {{ $hazelcastDown.severity }}
        {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: hazelcast database is in NotReady state (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Database in NotReady state, database read/write is failing.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{end -}}
  {{end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "hazelcast-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: hazelcast.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBhazelcastPhaseNotReady
      expr: kubedb_com_hazelcast_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB hazelcast Phase NotReady (hazelcast {{`{{`}} $labels.hazelcast {{`}}`}})
        description: "KubeDB hazelcast Phase not ready on {{`{{`}} $labels.hazelcast {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "hazelcast-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBhazelcastPhaseCritical
      expr: kubedb_com_hazelcast_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "hazelcast-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB hazelcast Phase Critical (hazelcast {{`{{`}} $labels.hazelcast {{`}}`}})
        description: "KubeDB hazelcast Phase Critical {{`{{`}} $labels.hazelcast {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}

{{ end }}
