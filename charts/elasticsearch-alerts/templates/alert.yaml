{{ $app := (include "elasticsearch-alerts.fullname" .) }}

{{ if (include "elasticsearch-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "elasticsearch-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
  {{ with .Values.form.alert.groups.database -}}
  {{ if (include "elasticsearch-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: elasticsearch.database.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $elasticsearchHeapUsageTooHigh := index (default dict .rules) "elasticsearchHeapUsageTooHigh" }}
    {{ if (and $elasticsearchHeapUsageTooHigh (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchHeapUsageTooHigh.enabled $elasticsearchHeapUsageTooHigh.severity))) -}}
    - alert: ElasticsearchHeapUsageTooHigh
      expr: (elasticsearch_jvm_memory_used_bytes{area="heap",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} / elasticsearch_jvm_memory_max_bytes{area="heap",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) * 100 > {{ $elasticsearchHeapUsageTooHigh.val }}
      for: {{ $elasticsearchHeapUsageTooHigh.duration }}
      labels:
        severity: {{ $elasticsearchHeapUsageTooHigh.severity }}
        alertname: elasticsearch_heap_usage_too_high
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Heap Usage Too High (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "The heap usage is over {{ $elasticsearchHeapUsageTooHigh.val -}}%\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchHeapUsageWarning := index (default dict .rules) "elasticsearchHeapUsageWarning" }}
    {{ if (and $elasticsearchHeapUsageWarning (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchHeapUsageWarning.enabled $elasticsearchHeapUsageWarning.severity))) -}}
    - alert: ElasticsearchHeapUsageWarning
      expr: (elasticsearch_jvm_memory_used_bytes{area="heap",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} / elasticsearch_jvm_memory_max_bytes{area="heap",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}) * 100 > {{ $elasticsearchHeapUsageWarning.val }}
      for: {{ $elasticsearchHeapUsageWarning.duration }}
      labels:
        severity: {{ $elasticsearchHeapUsageWarning.severity }}
        alertname: elasticsearch_heap_usage_warning
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Heap Usage warning (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "The heap usage is over {{ $elasticsearchHeapUsageWarning.val }}%\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchDiskOutOfSpace := index (default dict .rules) "elasticsearchDiskOutOfSpace" }}
    {{ if (and $elasticsearchDiskOutOfSpace (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchDiskOutOfSpace.enabled $elasticsearchDiskOutOfSpace.severity))) -}}
    - alert: ElasticsearchDiskOutOfSpace
      expr: elasticsearch_filesystem_data_available_bytes{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} / elasticsearch_filesystem_data_size_bytes{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 < {{ sub 100 $elasticsearchDiskOutOfSpace.val }}
      for: {{ $elasticsearchDiskOutOfSpace.duration }}
      labels:
        severity: {{ $elasticsearchDiskOutOfSpace.severity }}
        alertname: elasticsearch_disk_out_of_space
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch disk out of space (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "The disk usage is over {{ $elasticsearchDiskOutOfSpace.val }}%\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchDiskSpaceLow := index (default dict .rules) "elasticsearchDiskSpaceLow" }}
    {{ if (and $elasticsearchDiskSpaceLow (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchDiskSpaceLow.enabled $elasticsearchDiskSpaceLow.severity))) -}}
    - alert: ElasticsearchDiskSpaceLow
      expr: elasticsearch_filesystem_data_available_bytes{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} / elasticsearch_filesystem_data_size_bytes{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} * 100 < {{ sub 100 $elasticsearchDiskSpaceLow.val }}
      for: {{ $elasticsearchDiskSpaceLow.duration }}
      labels:
        severity: {{ $elasticsearchDiskSpaceLow.severity }}
        alertname: elasticsearch_disk_space_low
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch disk space low (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "The disk usage is over {{ $elasticsearchDiskSpaceLow.val }}%\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchClusterRed := index (default dict .rules) "elasticsearchClusterRed" }}
    {{ if (and $elasticsearchClusterRed (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchClusterRed.enabled $elasticsearchClusterRed.severity))) -}}
    - alert: ElasticsearchClusterRed
      expr: elasticsearch_cluster_health_status{color="red",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $elasticsearchClusterRed.duration }}
      labels:
        severity: {{ $elasticsearchClusterRed.severity }}
        alertname: elasticsearch_cluster_red
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Cluster Red (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Elastic Cluster Red status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchClusterYellow := index (default dict .rules) "elasticsearchClusterYellow" }}
    {{ if (and $elasticsearchClusterYellow (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchClusterYellow.enabled $elasticsearchClusterYellow.severity))) -}}
    - alert: ElasticsearchClusterYellow
      expr: elasticsearch_cluster_health_status{color="yellow",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $elasticsearchClusterYellow.duration }}
      labels:
        severity: {{ $elasticsearchClusterYellow.severity }}
        alertname: elasticsearch_cluster_yellow
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Cluster Yellow (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Elastic Cluster Yellow status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchHealthyNodes := index (default dict .rules) "elasticsearchHealthyNodes" }}
    {{ if (and $elasticsearchHealthyNodes (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchHealthyNodes.enabled $elasticsearchHealthyNodes.severity))) -}}
    - alert: ElasticsearchHealthyNodes
      expr: elasticsearch_cluster_health_number_of_nodes{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} < {{ $elasticsearchHealthyNodes.val }}
      for: {{ $elasticsearchHealthyNodes.duration }}
      labels:
        severity: {{ $elasticsearchHealthyNodes.severity }}
        alertname: elasticsearch_healthy_nodes
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Healthy Nodes (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Missing node in Elasticsearch cluster\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchHealthyDataNodes := index (default dict .rules) "elasticsearchHealthyDataNodes" }}
    {{ if (and $elasticsearchHealthyDataNodes (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchHealthyDataNodes.enabled $elasticsearchHealthyDataNodes.severity))) -}}
    - alert: ElasticsearchHealthyDataNodes
      expr: elasticsearch_cluster_health_number_of_data_nodes{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} < {{ $elasticsearchHealthyDataNodes.val }}
      for: {{ $elasticsearchHealthyDataNodes.duration }}
      labels:
        severity: {{ $elasticsearchHealthyDataNodes.severity }}
        alertname: elasticsearch_healthy_data_nodes
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Healthy Data Nodes (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Missing data node in Elasticsearch cluster\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchRelocatingShards := index (default dict .rules) "elasticsearchRelocatingShards" }}
    {{ if (and $elasticsearchRelocatingShards (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchRelocatingShards.enabled $elasticsearchRelocatingShards.severity))) -}}
    - alert: ElasticsearchRelocatingShards
      expr: elasticsearch_cluster_health_relocating_shards{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > 0
      for: {{ $elasticsearchRelocatingShards.duration }}
      labels:
        severity: {{ $elasticsearchRelocatingShards.severity }}
        alertname: elasticsearch_relocating_shards
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch relocating shards (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Elasticsearch is relocating shards\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchInitializingShards := index (default dict .rules) "elasticsearchInitializingShards" }}
    {{ if (and $elasticsearchInitializingShards (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchInitializingShards.enabled $elasticsearchInitializingShards.severity))) -}}
    - alert: ElasticsearchInitializingShards
      expr: elasticsearch_cluster_health_initializing_shards{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > 0
      for: {{ $elasticsearchInitializingShards.duration }}
      labels:
        severity: {{ $elasticsearchInitializingShards.severity }}
        alertname: elasticsearch_initializing_shards
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch initializing shards (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Elasticsearch is initializing shards\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchUnassignedShards := index (default dict .rules) "elasticsearchUnassignedShards" }}
    {{ if (and $elasticsearchUnassignedShards (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchUnassignedShards.enabled $elasticsearchUnassignedShards.severity))) -}}
    - alert: ElasticsearchUnassignedShards
      expr: elasticsearch_cluster_health_unassigned_shards{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > 0
      for: {{ $elasticsearchUnassignedShards.duration }}
      labels:
        severity: {{ $elasticsearchUnassignedShards.severity }}
        alertname: elasticsearch_unassigned_shards
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch unassigned shards (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Elasticsearch has unassigned shards\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchPendingTasks := index (default dict .rules) "elasticsearchPendingTasks" }}
    {{ if (and $elasticsearchPendingTasks (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchPendingTasks.enabled $elasticsearchPendingTasks.severity))) -}}
    - alert: ElasticsearchPendingTasks
      expr: elasticsearch_cluster_health_number_of_pending_tasks{job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"} > 0
      for: {{ $elasticsearchPendingTasks.duration }}
      labels:
        severity: {{ $elasticsearchPendingTasks.severity }}
        alertname: elasticsearch_pending_tasks
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch pending tasks (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "Elasticsearch has pending tasks. Cluster works slowly.\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}

    {{ $elasticsearchNoNewDocuments10m := index (default dict .rules) "elasticsearchNoNewDocuments10m" }}
    {{ if (and $elasticsearchNoNewDocuments10m (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $elasticsearchNoNewDocuments10m.enabled $elasticsearchNoNewDocuments10m.severity))) -}}
    - alert: ElasticsearchNoNewDocuments10m
      expr: increase(elasticsearch_indices_docs{es_data_node="true",job="{{ $app }}-stats",namespace="{{ $.Release.Namespace }}"}[10m]) < 1
      for: {{ $elasticsearchNoNewDocuments10m.duration }}
      labels:
        severity: {{ $elasticsearchNoNewDocuments10m.severity }}
        alertname: elasticsearch_no_new_documents_10m
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch no new documents (instance {{`{{`}} $labels.instance {{`}}`}})
        description: "No new documents for 10 min!\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    
    {{ $diskUsageHigh := index (default dict .rules) "diskUsageHigh" }}
    {{ if (and $diskUsageHigh (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskUsageHigh.enabled $diskUsageHigh.severity))) -}}
    - alert: DiskUsageHigh
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskUsageHigh.val }}
      for: {{ $diskUsageHigh.duration }}
      labels:
        severity: {{ $diskUsageHigh.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
    {{ $diskAlmostFull := index (default dict .rules) "diskAlmostFull" }}
    {{ if (and $diskAlmostFull (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $diskAlmostFull.enabled $diskAlmostFull.severity))) -}}
    - alert: DiskAlmostFull
      expr: (kubelet_volume_stats_used_bytes{service="kubernetes"} / on(persistentvolumeclaim) group_left(pod) ((kubelet_volume_stats_used_bytes{service="kubernetes"} + on(persistentvolumeclaim) group_left(pod) kube_pod_spec_volumes_persistentvolumeclaims_info{pod=~"{{ $.Release.Name }}-.+$",namespace=~"{{ $.Release.Namespace }}"}) ) )
        * 100 > {{ $diskAlmostFull.val }}
      for: {{ $diskAlmostFull.duration }}
      labels:
        severity: {{ $diskAlmostFull.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Persistent Volume Usages in instance {{`{{`}} $labels.instance {{`}}`}}
        description: "Persistent Volume Usages\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.provisioner -}}
  {{ if (include "elasticsearch-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: elasticsearch.provisioner.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $appPhaseNotReady := index (default dict .rules) "appPhaseNotReady" }}
    {{ if (and $appPhaseNotReady (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseNotReady.enabled $appPhaseNotReady.severity))) -}}
    - alert: KubeDBElasticsearchPhaseNotReady
      expr: kubedb_com_elasticsearch_status_phase{phase="NotReady",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseNotReady.duration }}
      labels:
        severity: {{ $appPhaseNotReady.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB Elasticsearch Phase NotReady (elasticsearch {{`{{`}} $labels.elasticsearch {{`}}`}})
        description: "KubeDB Elasticsearch Phase not ready on {{`{{`}} $labels.elasticsearch {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $appPhaseCritical := index (default dict .rules) "appPhaseCritical" }}
    {{ if (and $appPhaseCritical (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $appPhaseCritical.enabled $appPhaseCritical.severity))) -}}
    - alert: KubeDBElasticsearchPhaseCritical
      expr: kubedb_com_elasticsearch_status_phase{phase="Critical",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $appPhaseCritical.duration }}
      labels:
        severity: {{ $appPhaseCritical.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: KubeDB Elasticsearch Phase Critical (elasticsearch {{`{{`}} $labels.elasticsearch {{`}}`}})
        description: "KubeDB Elasticsearch Phase Critical {{`{{`}} $labels.elasticsearch {{`}}`}}\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.opsManager -}}
  {{ if (include "elasticsearch-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: elasticsearch.opsManager.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $opsRequestOnProgress := index (default dict .rules) "opsRequestOnProgress" }}
    {{ if (and $opsRequestOnProgress (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestOnProgress.enabled $opsRequestOnProgress.severity))) -}}
    - alert: KubeDBElasticsearchOpsRequestOnProgress
      expr: ops_kubedb_com_elasticsearchopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestOnProgress.duration }}
      labels:
        severity: {{ $opsRequestOnProgress.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: ElasticsearchOpsRequest on progress (elasticsearchopsrequest {{`{{`}} $labels.elasticsearchopsrequest {{`}}`}})
        description: "ElasticsearchOpsRequest {{`{{`}} $labels.elasticsearchopsrequest {{`}}`}} is in progressressing status\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestStatusProgressingToLong := index (default dict .rules) "opsRequestStatusProgressingToLong" }}
    {{ if (and $opsRequestStatusProgressingToLong (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestStatusProgressingToLong.enabled $opsRequestStatusProgressingToLong.severity))) -}}
    - alert: KubeDBElasticsearchOpsRequestStatusProgressingToLong
      expr: ops_kubedb_com_elasticsearchopsrequest_status_phase{phase="Progressing",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestStatusProgressingToLong.duration }}
      labels:
        severity: {{ $opsRequestStatusProgressingToLong.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: ElasticsearchOpsRequest is in progressing status for too long (elasticsearchopsrequest {{`{{`}} $labels.elasticsearchopsrequest {{`}}`}})
        description: "ElasticsearchOpsRequest {{`{{`}} $labels.elasticsearchopsrequest {{`}}`}} is in progressing status for too long\n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $opsRequestFailed := index (default dict .rules) "opsRequestFailed" }}
    {{ if (and $opsRequestFailed (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $opsRequestFailed.enabled $opsRequestFailed.severity))) -}}
    - alert: KubeDBElasticsearchOpsRequestFailed
      expr: ops_kubedb_com_elasticsearchopsrequest_status_phase{phase="Failed",app="{{ $app }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $opsRequestFailed.duration }}
      labels:
        severity: {{ $opsRequestFailed.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: ElasticsearchOpsRequest failed (elasticsearchopsrequest {{`{{`}} $labels.elasticsearchopsrequest {{`}}`}})
        description: "ElasticsearchOpsRequest {{`{{`}} $labels.elasticsearchopsrequest {{`}}`}} failed \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{- end }}
  {{ end -}}
  {{ end -}}


  {{ with .Values.form.alert.groups.stash -}}
  {{ if (include "elasticsearch-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) -}}
  - name: elasticsearch.stash.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $backupSessionFailed := index (default dict .rules) "backupSessionFailed" }}
    {{ if (and $backupSessionFailed (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $backupSessionFailed.enabled $backupSessionFailed.severity))) -}}
    - alert: ElasticsearchStashBackupSessionFailed
      expr: stash_backup_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $backupSessionFailed.duration }}
      labels:
        severity: {{ $backupSessionFailed.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Stash backup session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "Elasticsearch Stash backupsession failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $restoreSessionFailed := index (default dict .rules) "restoreSessionFailed" }}
    {{ if (and $restoreSessionFailed (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $restoreSessionFailed.enabled $restoreSessionFailed.severity))) -}}
    - alert: ElasticsearchStashRestoreSessionFailed
      expr: stash_restore_session_success * on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_restoresession_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} == 0
      for: {{ $restoreSessionFailed.duration }}
      labels:
        severity: {{ $restoreSessionFailed.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Stash restore session failed (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "Elasticsearch Stash restore session failed {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $noBackupSessionForTooLong := index (default dict .rules) "noBackupSessionForTooLong" }}
    {{ if (and $noBackupSessionForTooLong (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $noBackupSessionForTooLong.enabled $noBackupSessionForTooLong.severity))) -}}
    - alert: ElasticsearchStashNoBackupSessionForTooLong
      expr: time() - stash_backup_last_success_time_seconds + on(invoker_name, invoker_kind) group_left(target_name, target_kind) stash_appscode_com_backupconfiguration_info{target_name="{{ $app }}", target_kind="AppBinding", namespace="{{ $.Release.Namespace }}"} - 1 > {{ $noBackupSessionForTooLong.val }}
      for: {{ $noBackupSessionForTooLong.duration }}
      labels:
        severity: {{ $noBackupSessionForTooLong.severity }}
        {{- include "elasticsearch-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: Elasticsearch Stash no backup for last {{ $noBackupSessionForTooLong.val }} second (invoker_name {{`{{`}} $labels.invoker_name {{`}}`}})
        description: "Elasticsearch Stash no backup for too long {{`{{`}} $labels.invoker_name {{`}}`}} \n  VALUE = {{`{{`}} $value {{`}}`}}\n  LABELS = {{`{{`}} $labels {{`}}`}}"
    {{ end -}}
    {{ $repositoryCorrupted := index (default dict .rules) "repositoryCorrupted" }}
    {{ if (and $repositoryCorrupted (include "elasticsearch-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $repositoryCorrupted.enabled $repositoryCorrupted.severity))) -}}
    - alert: ElasticsearchStashRepositoryCorrupted
