{{ $app := (include "nats-alerts.fullname" .) }}
{{ $job := .Values.grafana.jobName }}
{{ $natsConsumerLabels := "namespace, job, account_id, stream_name, consumer_name" }}
{{ $natsStreamLabels := "namespace, job, account_id, stream_name" }}

{{ if (include "nats-alerts.alertsEnabled" .Values.form.alert.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nats-alerts.labels" . | nindent 4 }}
{{- if .Values.form.alert.labels }}
    {{- toYaml .Values.form.alert.labels | nindent 4 }}
{{- end }}
{{- if .Values.form.alert.annotations }}
  annotations:
    {{- toYaml .Values.form.alert.annotations | nindent 4 }}
{{- end }}
spec:
  groups:
{{- with .Values.form.alert.groups.core }}
{{- if (include "nats-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: nats.core.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    - record: nats:jetstream_consumer_num_pending:max
      expr: >-
        max by ({{ $natsConsumerLabels }}) (
          nats_consumer_num_pending{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_consumer_leader="true"}
        )
    - record: nats:jetstream_consumer_num_ack_pending:max
      expr: >-
        max by ({{ $natsConsumerLabels }}) (
          nats_consumer_num_ack_pending{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_consumer_leader="true"}
        )
    - record: nats:jetstream_consumer_num_pending:max_2m
      expr: max_over_time(nats:jetstream_consumer_num_pending:max[2m])
    - record: nats:jetstream_consumer_num_ack_pending:max_2m
      expr: max_over_time(nats:jetstream_consumer_num_ack_pending:max[2m])
    - record: nats:jetstream_consumer_delivered_progress_10m:max
      expr: >-
        max by ({{ $natsConsumerLabels }}) (
          max_over_time(nats_consumer_delivered_consumer_seq{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_consumer_leader="true"}[10m])
          -
          min_over_time(nats_consumer_delivered_consumer_seq{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_consumer_leader="true"}[10m])
        )
    - record: nats:jetstream_consumer_delivered_progress_10m:max_2m
      expr: max_over_time(nats:jetstream_consumer_delivered_progress_10m:max[2m])
    - record: nats:jetstream_stream_total_messages:max
      expr: >-
        max by ({{ $natsStreamLabels }}) (
          nats_stream_total_messages{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_stream_leader="true"}
        )
    - record: nats:jetstream_stream_limit_messages:max
      expr: >-
        max by ({{ $natsStreamLabels }}) (
          nats_stream_limit_messages{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_stream_leader="true"}
        )
    - record: nats:jetstream_stream_total_messages:max_2m
      expr: max_over_time(nats:jetstream_stream_total_messages:max[2m])
    - record: nats:jetstream_stream_limit_messages:max_2m
      expr: max_over_time(nats:jetstream_stream_limit_messages:max[2m])
    - record: nats:jetstream_stream_total_bytes:max
      expr: >-
        max by ({{ $natsStreamLabels }}) (
          nats_stream_total_bytes{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_stream_leader="true"}
        )
    - record: nats:jetstream_stream_limit_bytes:max
      expr: >-
        max by ({{ $natsStreamLabels }}) (
          nats_stream_limit_bytes{job="{{ $job }}",namespace="{{ $.Release.Namespace }}",is_stream_leader="true"}
        )
    - record: nats:jetstream_stream_total_bytes:max_2m
      expr: max_over_time(nats:jetstream_stream_total_bytes:max[2m])
    - record: nats:jetstream_stream_limit_bytes:max_2m
      expr: max_over_time(nats:jetstream_stream_limit_bytes:max[2m])
    - record: nats:server_total_consumers:max
      expr: >-
        max by (namespace, job) (
          nats_server_total_consumers{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}
        )
    - record: nats:server_total_consumers:max_2m
      expr: max_over_time(nats:server_total_consumers:max[2m])
    {{ $natsDown := index (default dict .rules) "natsDown" }}
    {{ if (and $natsDown (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsDown.enabled $natsDown.severity))) -}}
    - alert: NatsDown
      expr: up{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} == 0 or absent_over_time(up{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[2m])
      for: {{ $natsDown.duration }}
      labels:
        severity: {{ $natsDown.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS target is down or missing from Prometheus scrapes"
        description: "Prometheus has not observed a healthy NATS scrape target for job {{`{{`}} $labels.job {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}}."
{{- end }}
    {{ $natsReplicasNotReady := index (default dict .rules) "natsReplicasNotReady" }}
    {{ if (and $natsReplicasNotReady (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsReplicasNotReady.enabled $natsReplicasNotReady.severity))) -}}
    - alert: NatsReplicasNotReady
      expr: >-
        max(kube_statefulset_status_replicas_ready{namespace="{{ $.Release.Namespace }}",statefulset="{{ $app }}"})
        <
        max(kube_statefulset_replicas{namespace="{{ $.Release.Namespace }}",statefulset="{{ $app }}"})
      for: {{ $natsReplicasNotReady.duration }}
      labels:
        severity: {{ $natsReplicasNotReady.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS StatefulSet has fewer ready replicas than desired"
        description: "The NATS StatefulSet {{ $app }} has fewer ready replicas than desired in namespace {{ $.Release.Namespace }}."
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.form.alert.groups.resourceUtilization }}
{{- if (include "nats-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: nats.resourceUtilization.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $natsJetStreamHighMemoryUsage := index (default dict .rules) "natsJetStreamHighMemoryUsage" }}
    {{ if (and $natsJetStreamHighMemoryUsage (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamHighMemoryUsage.enabled $natsJetStreamHighMemoryUsage.severity))) -}}
    - alert: NatsJetStreamHighMemoryUsage
      expr: (nats_varz_jetstream_stats_memory{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} / nats_varz_jetstream_config_max_memory{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} * 100) > {{ $natsJetStreamHighMemoryUsage.val }}
      for: {{ $natsJetStreamHighMemoryUsage.duration }}
      labels:
        severity: {{ $natsJetStreamHighMemoryUsage.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS JetStream high memory usage (instance {{`{{`}} $labels.server_id {{`}}`}})"
        description: "JetStream memory usage is above {{ $natsJetStreamHighMemoryUsage.val }}%."
{{- end }}
    {{ $natsJetStreamHighStorageUsage := index (default dict .rules) "natsJetStreamHighStorageUsage" }}
    {{ if (and $natsJetStreamHighStorageUsage (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamHighStorageUsage.enabled $natsJetStreamHighStorageUsage.severity))) -}}
    - alert: NatsJetStreamHighStorageUsage
      expr: (nats_varz_jetstream_stats_storage{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} / nats_varz_jetstream_config_max_storage{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} * 100) > {{ $natsJetStreamHighStorageUsage.val }}
      for: {{ $natsJetStreamHighStorageUsage.duration }}
      labels:
        severity: {{ $natsJetStreamHighStorageUsage.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS JetStream high storage usage (instance {{`{{`}} $labels.server_id {{`}}`}})"
        description: "JetStream storage usage is above {{ $natsJetStreamHighStorageUsage.val }}%."
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.form.alert.groups.consumerHealth }}
{{- if (include "nats-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: nats.consumerHealth.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $natsJetStreamHighPendingMessages := index (default dict .rules) "natsJetStreamHighPendingMessages" }}
    {{ if (and $natsJetStreamHighPendingMessages (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamHighPendingMessages.enabled $natsJetStreamHighPendingMessages.severity))) -}}
    - alert: NatsJetStreamHighPendingMessages
      expr: nats:jetstream_consumer_num_pending:max_2m > {{ $natsJetStreamHighPendingMessages.val }}
      for: {{ $natsJetStreamHighPendingMessages.duration }}
      labels:
        severity: {{ $natsJetStreamHighPendingMessages.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "High number of pending messages for consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}}"
        description: "Consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}} has more than {{ $natsJetStreamHighPendingMessages.val }} pending messages."
{{- end }}
    {{ $natsJetStreamHighPendingMessagesWarning := index (default dict .rules) "natsJetStreamHighPendingMessagesWarning" }}
    {{ if (and $natsJetStreamHighPendingMessagesWarning (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamHighPendingMessagesWarning.enabled $natsJetStreamHighPendingMessagesWarning.severity))) -}}
    - alert: NatsJetStreamHighPendingMessagesWarning
      expr: nats:jetstream_consumer_num_pending:max_2m > {{ $natsJetStreamHighPendingMessagesWarning.val }} and nats:jetstream_consumer_num_pending:max_2m <= {{ dig "natsJetStreamHighPendingMessages" "val" 0 (default dict .rules) }}
      for: {{ $natsJetStreamHighPendingMessagesWarning.duration }}
      labels:
        severity: {{ $natsJetStreamHighPendingMessagesWarning.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "Warning: High number of pending messages for consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}}"
        description: "Consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}} has more than {{ $natsJetStreamHighPendingMessagesWarning.val }} pending messages."
{{- end }}
    {{ $natsJetStreamHighAckPending := index (default dict .rules) "natsJetStreamHighAckPending" }}
    {{ if (and $natsJetStreamHighAckPending (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamHighAckPending.enabled $natsJetStreamHighAckPending.severity))) -}}
    - alert: NatsJetStreamHighAckPending
      expr: nats:jetstream_consumer_num_ack_pending:max_2m > {{ $natsJetStreamHighAckPending.val }}
      for: {{ $natsJetStreamHighAckPending.duration }}
      labels:
        severity: {{ $natsJetStreamHighAckPending.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "High number of unacknowledged messages for consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}}"
        description: "Consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}} has more than {{ $natsJetStreamHighAckPending.val }} messages pending acknowledgement."
{{- end }}
    {{ $natsJetStreamBacklogNoProgress := index (default dict .rules) "natsJetStreamBacklogNoProgress" }}
    {{ if (and $natsJetStreamBacklogNoProgress (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamBacklogNoProgress.enabled $natsJetStreamBacklogNoProgress.severity))) -}}
    - alert: NatsJetStreamBacklogNoProgress
      expr: >-
        nats:jetstream_consumer_num_pending:max_2m > {{ $natsJetStreamBacklogNoProgress.val }}
        and on ({{ $natsConsumerLabels }})
        nats:jetstream_consumer_delivered_progress_10m:max_2m == 0
      for: {{ $natsJetStreamBacklogNoProgress.duration }}
      labels:
        severity: {{ $natsJetStreamBacklogNoProgress.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "Consumer backlog is not draining for {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}}"
        description: "Consumer {{`{{`}} $labels.consumer_name {{`}}`}} on stream {{`{{`}} $labels.stream_name {{`}}`}} has more than {{ $natsJetStreamBacklogNoProgress.val }} pending messages and no delivery progress over the last 10 minutes."
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.form.alert.groups.streamPerformance }}
{{- if (include "nats-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: nats.streamPerformance.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $natsJetStreamNearMessageLimit := index (default dict .rules) "natsJetStreamNearMessageLimit" }}
    {{ if (and $natsJetStreamNearMessageLimit (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamNearMessageLimit.enabled $natsJetStreamNearMessageLimit.severity))) -}}
    - alert: NatsJetStreamNearMessageLimit
      expr: >-
        ((nats:jetstream_stream_total_messages:max_2m / nats:jetstream_stream_limit_messages:max_2m) * 100) > {{ $natsJetStreamNearMessageLimit.val }}
        and on ({{ $natsStreamLabels }})
        nats:jetstream_stream_limit_messages:max_2m > 0
      for: {{ $natsJetStreamNearMessageLimit.duration }}
      labels:
        severity: {{ $natsJetStreamNearMessageLimit.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "Stream {{`{{`}} $labels.stream_name {{`}}`}} is nearing its message limit"
        description: "Stream {{`{{`}} $labels.stream_name {{`}}`}} is above {{ $natsJetStreamNearMessageLimit.val }}% of its configured message limit."
{{- end }}
    {{ $natsJetStreamNearByteLimit := index (default dict .rules) "natsJetStreamNearByteLimit" }}
    {{ if (and $natsJetStreamNearByteLimit (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamNearByteLimit.enabled $natsJetStreamNearByteLimit.severity))) -}}
    - alert: NatsJetStreamNearByteLimit
      expr: >-
        ((nats:jetstream_stream_total_bytes:max_2m / nats:jetstream_stream_limit_bytes:max_2m) * 100) > {{ $natsJetStreamNearByteLimit.val }}
        and on ({{ $natsStreamLabels }})
        nats:jetstream_stream_limit_bytes:max_2m > 0
      for: {{ $natsJetStreamNearByteLimit.duration }}
      labels:
        severity: {{ $natsJetStreamNearByteLimit.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "Stream {{`{{`}} $labels.stream_name {{`}}`}} is nearing its byte limit"
        description: "Stream {{`{{`}} $labels.stream_name {{`}}`}} is above {{ $natsJetStreamNearByteLimit.val }}% of its configured byte limit."
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.form.alert.groups.connectivity }}
{{- if (include "nats-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: nats.connectivity.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $natsJetStreamDisabled := index (default dict .rules) "natsJetStreamDisabled" }}
    {{ if (and $natsJetStreamDisabled (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsJetStreamDisabled.enabled $natsJetStreamDisabled.severity))) -}}
    - alert: NatsJetStreamDisabled
      expr: nats_server_jetstream_disabled{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} == 1
      for: {{ $natsJetStreamDisabled.duration }}
      labels:
        severity: {{ $natsJetStreamDisabled.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "JetStream is disabled on NATS server {{`{{`}} $labels.server_name {{`}}`}}"
        description: "JetStream is disabled on server {{`{{`}} $labels.server_name {{`}}`}}."
{{- end }}
    {{ $natsSlowConsumers := index (default dict .rules) "natsSlowConsumers" }}
    {{ if (and $natsSlowConsumers (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsSlowConsumers.enabled $natsSlowConsumers.severity))) -}}
    - alert: NatsSlowConsumers
      expr: >-
        sum by (namespace, job, pod, server_id, server_name) (
          increase(nats_varz_slow_consumers{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[10m])
        ) >= {{ $natsSlowConsumers.val }}
      for: {{ $natsSlowConsumers.duration }}
      labels:
        severity: {{ $natsSlowConsumers.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS server {{`{{`}} $labels.server_name {{`}}`}} is seeing slow consumers"
        description: "NATS server {{`{{`}} $labels.server_name {{`}}`}} reported slow-consumer disconnections in the last 10 minutes."
{{- end }}
    {{ $natsStalledClients := index (default dict .rules) "natsStalledClients" }}
    {{ if (and $natsStalledClients (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsStalledClients.enabled $natsStalledClients.severity))) -}}
    - alert: NatsStalledClients
      expr: >-
        sum by (namespace, job, pod, server_id, server_name) (
          increase(nats_varz_stalled_clients{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[10m])
        ) >= {{ $natsStalledClients.val }}
      for: {{ $natsStalledClients.duration }}
      labels:
        severity: {{ $natsStalledClients.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS server {{`{{`}} $labels.server_name {{`}}`}} has stalled clients"
        description: "NATS server {{`{{`}} $labels.server_name {{`}}`}} reported stalled-client events in the last 10 minutes."
{{- end }}
    {{ $natsStaleConnections := index (default dict .rules) "natsStaleConnections" }}
    {{ if (and $natsStaleConnections (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsStaleConnections.enabled $natsStaleConnections.severity))) -}}
    - alert: NatsStaleConnections
      expr: >-
        sum by (namespace, job, pod, server_id, server_name) (
          increase(nats_varz_stale_connections{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"}[10m])
        ) >= {{ $natsStaleConnections.val }}
      for: {{ $natsStaleConnections.duration }}
      labels:
        severity: {{ $natsStaleConnections.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "NATS server {{`{{`}} $labels.server_name {{`}}`}} has stale connections"
        description: "NATS server {{`{{`}} $labels.server_name {{`}}`}} reported stale connections in the last 10 minutes."
{{- end }}
    {{ $natsHighActiveConnections := index (default dict .rules) "natsHighActiveConnections" }}
    {{ if (and $natsHighActiveConnections (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsHighActiveConnections.enabled $natsHighActiveConnections.severity))) -}}
    - alert: NatsHighActiveConnections
      expr: nats_varz_connections{job="{{ $job }}",namespace="{{ $.Release.Namespace }}"} > {{ $natsHighActiveConnections.val }}
      for: {{ $natsHighActiveConnections.duration }}
      labels:
        severity: {{ $natsHighActiveConnections.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "High active connections"
        description: "Active connections are above {{ $natsHighActiveConnections.val }}."
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.form.alert.groups.consumerManagement }}
{{- if (include "nats-alerts.alertGroupEnabled" (list $.Values.form.alert.enabled .)) }}
  - name: nats.consumerManagement.{{ $.Release.Namespace }}.{{ $app }}.rules
    rules:
    {{ $natsHighTotalConsumers := index (default dict .rules) "natsHighTotalConsumers" }}
    {{ if (and $natsHighTotalConsumers (include "nats-alerts.alertEnabled" (list $.Values.form.alert.enabled .enabled $natsHighTotalConsumers.enabled $natsHighTotalConsumers.severity))) -}}
    - alert: NatsHighTotalConsumers
      expr: nats:server_total_consumers:max_2m > {{ $natsHighTotalConsumers.val }}
      for: {{ $natsHighTotalConsumers.duration }}
      labels:
        severity: {{ $natsHighTotalConsumers.severity }}
        {{- include "nats-alerts.alertLabels" $ | nindent 8 }}
      annotations:
        summary: "High total consumers"
        description: "Total consumers are above {{ $natsHighTotalConsumers.val }}."
{{- end }}
{{- end }}
{{- end }}
{{ end }}
